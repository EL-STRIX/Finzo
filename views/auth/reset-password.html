<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Finzo | Reset Security Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="../../assets/css/custom.css">
    <link rel="stylesheet" href="../../assets/css/dark-mode.css">
    <meta http-equiv="Expires" content="0">
    <style>
        /* Interactive Placeholder Polish */
        input:focus::placeholder {
            color: transparent !important;
            transition: color 0.2s ease;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased overflow-hidden">
<main class="min-h-screen flex items-stretch">
    <!-- Left Column: Visual Branding -->
    <section class="hidden lg:flex lg:w-1/2 relative architectural-gradient flex-col justify-between p-16 overflow-hidden">
        <div class="relative z-10">
            <div class="flex items-center gap-2 mb-20">
                <span class="text-3xl font-black tracking-tighter text-white font-headline cursor-pointer" onclick="window.location.href='../../index.html'">Finzo</span>
            </div>
            <div class="max-w-md text-white">
                <p class="font-headline text-5xl font-bold leading-tight mb-6">Reset <br/>Ciphers.</p>
                <p class="text-on-primary-container text-lg opacity-80 leading-relaxed">Establish a new cryptographic key for your institutional wealth management portal.</p>
            </div>
        </div>
        <div class="absolute inset-0 z-0">
            <img alt="Interior Architecture" class="w-full h-full object-cover brightness-[0.35] contrast-[1.1]" src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?q=80&w=2069&auto=format&fit=crop"/>
            <div class="absolute inset-0 bg-primary/30 mix-blend-multiply"></div>
        </div>
    </section>

    <!-- Right Column: Reset Form -->
    <section class="w-full lg:w-1/2 flex flex-col justify-center items-center p-8 md:p-24 bg-surface">
        <div class="w-full max-w-md">
            <div class="mb-12">
                <h2 class="text-3xl font-headline font-bold text-primary tracking-tight mb-2">Reset Password</h2>
                <p class="text-on-surface-variant font-medium">Define your new architectural access key.</p>
            </div>

            <!-- Institutional Error Banner -->
            <div id="auth-error-banner" class="error-banner">
                <div class="glass-error p-4 rounded-xl flex items-center gap-3">
                    <span class="material-symbols-outlined text-error text-xl">warning</span>
                    <span class="text-xs font-bold text-error uppercase tracking-wider">Update failed. Security ciphers do not meet architectural complexity standards.</span>
                </div>
            </div>

            <form action="#" class="space-y-6" method="POST">
                <div class="space-y-4">
                    <div class="space-y-1">
                        <label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">New Security Cipher</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-xl">lock</span>
                            <input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-on-surface text-sm transition-all shadow-sm" placeholder="••••••••••••" type="password" required/>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-widest ml-1">Confirm Cipher</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant text-xl">verified_user</span>
                            <input class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border-none rounded-xl focus:ring-2 focus:ring-primary/20 text-on-surface text-sm transition-all shadow-sm" placeholder="••••••••••••" type="password" required/>
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button class="w-full architectural-gradient text-white font-headline font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
                        <span>Initialize Key Update</span>
                        <span class="material-symbols-outlined text-xl">lock_reset</span>
                    </button>
                    <a href="login.html" class="mt-8 w-full flex items-center justify-center gap-2 text-sm font-bold text-on-surface-variant hover:text-primary transition-colors">
                        <span class="material-symbols-outlined text-lg">arrow_back</span>
                        Back to Login
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="../../assets/js/component-loader.js"></script>
<script src="../../assets/js/main.js"></script>
</body>
</html>
