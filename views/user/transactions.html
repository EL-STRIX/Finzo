<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Transactions | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/user.css"/>
<link rel="stylesheet" href="../../assets/css/user-panel.css"/>
<style>
.filter-tab{padding:8px 16px;border-radius:var(--radius-md);font-size:11px;font-weight:800;border:none;cursor:pointer;transition:var(--transition);color:var(--text-secondary);background:transparent;letter-spacing:0.04em}
.filter-tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(8,145,178,0.3)}
.tx-row-credit{background:rgba(16,185,129,0.03)}
.tx-row-debit{background:rgba(244,63,94,0.03)}
.dark .tx-row-credit{background:rgba(16,185,129,0.04)}
.dark .tx-row-debit{background:rgba(244,63,94,0.04)}
</style>
</head>
<body>
<script src="../../assets/js/user-shared.js"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>
<div class="page-content">
<div class="page-header animate-in"><div class="page-eyebrow">Banking</div><div class="page-title">All Transactions</div><div class="page-subtitle">Complete history of all your account activity</div></div>

<!-- FILTER BAR -->
<div class="card animate-in animate-delay-1" style="margin-bottom:20px;overflow:hidden">
<div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;background:var(--bg-input)">
<button class="filter-tab active" onclick="filterTxns('all',this)">All</button>
<button class="filter-tab" onclick="filterTxns('credit',this)">Credits</button>
<button class="filter-tab" onclick="filterTxns('debit',this)">Debits</button>
<button class="filter-tab" onclick="filterTxns('transfer',this)">Transfers</button>
</div>
<div style="padding:14px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
<div style="flex:1;min-width:200px">
<div style="font-size:9px;font-weight:800;color:var(--text-secondary);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px">Search</div>
<div style="position:relative"><span class="material-symbols-outlined" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--text-placeholder)">search</span><input type="text" id="search" placeholder="Search transactions..." style="width:100%;height:42px;border-radius:var(--radius-md);border:1.5px solid var(--border-input);background:var(--bg-input);color:var(--text-primary);font-size:13px;padding:0 14px 0 40px;outline:none;font-family:inherit" oninput="renderTable()"/></div>
</div>
<div style="flex:1;min-width:130px;">
<div style="font-size:9px;font-weight:800;color:var(--text-secondary);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px">From Date</div>
<input type="date" id="from-date" style="width:100%;height:42px;border-radius:var(--radius-md);border:1.5px solid var(--border-input);background:var(--bg-input);color:var(--text-primary);font-size:13px;padding:0 12px;outline:none;font-family:inherit" onchange="renderTable()"/>
</div>
<div style="flex:1;min-width:130px;">
<div style="font-size:9px;font-weight:800;color:var(--text-secondary);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:6px">To Date</div>
<input type="date" id="to-date" style="width:100%;height:42px;border-radius:var(--radius-md);border:1.5px solid var(--border-input);background:var(--bg-input);color:var(--text-primary);font-size:13px;padding:0 12px;outline:none;font-family:inherit" onchange="renderTable()"/>
</div>
<button class="btn btn-ghost btn-sm" onclick="resetFilters()" style="align-self:flex-end;height:42px;">Reset</button>
</div>
</div>

<!-- TABLE -->
<div class="card animate-in animate-delay-2" style="overflow:hidden">
<div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
<div style="font-size:13px;font-weight:800;color:var(--text-primary);letter-spacing:0.08em;text-transform:uppercase">Transaction History</div>
<span id="txn-count" style="font-size:12px;font-weight:600;color:var(--text-secondary)">Loading...</span>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>#</th><th>Date & Time</th><th>Description</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Status</th><th>Receipt</th></tr></thead>
<tbody id="txn-body"></tbody>
</table>
</div>
<div style="padding:14px 20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center">
<span id="pag-info" style="font-size:11px;font-weight:700;color:var(--text-secondary)"></span>
<div class="pagination" id="pag-nums"></div>
</div>
</div>
</div>
</div>

<script>
buildSidebar('transactions'); buildNavbar('Banking','All Transactions');
handleStatusRedirect('transactions');

const ROW_PP = 8;
let page = 1, activeFilter = 'all';
let allTxns = [];

// Fetch transactions from API
async function loadTransactions() {
  try {
    const params = new URLSearchParams();
    if (activeFilter !== 'all') params.set('type', activeFilter);
    const search = document.getElementById('search').value;
    if (search) params.set('search', search);
    const fromDate = document.getElementById('from-date').value;
    if (fromDate) params.set('from_date', fromDate);
    const toDate = document.getElementById('to-date').value;
    if (toDate) params.set('to_date', toDate);
    params.set('limit', '200');

    const res = await fetch('/api/user/transactions.php?' + params.toString(), { credentials: 'same-origin' });
    const data = await res.json();
    if (data.success && data.transactions) {
      allTxns = data.transactions.map(tx => ({
        id: tx.txn_id || tx.reference_id || '-',
        date: new Date(tx.created_at).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}),
        time: new Date(tx.created_at).toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}) + ' IST',
        desc: tx.description || tx.type,
        type: tx.type === 'credit' || tx.type === 'deposit' ? 'credit' : tx.type === 'transfer' ? 'transfer' : 'debit',
        amount: parseFloat(tx.amount),
        balanceAfter: parseFloat(tx.balance_after || 0),
        status: tx.status || 'completed'
      }));
    } else {
      allTxns = [];
    }
  } catch (err) {
    console.warn('Failed to load transactions:', err);
    allTxns = [];
  }
  renderTable();
}

let filtered = [];

function filterTxns(type, el) {
  activeFilter = type;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  page = 1;
  loadTransactions();
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('from-date').value = '';
  document.getElementById('to-date').value = '';
  activeFilter = 'all';
  document.querySelectorAll('.filter-tab').forEach((b,i)=>b.classList.toggle('active',i===0));
  page = 1; loadTransactions();
}

function renderTable() {
  const search = document.getElementById('search').value.toLowerCase();
  filtered = allTxns.filter(t => {
    if (activeFilter !== 'all' && t.type !== activeFilter) return false;
    if (search && !t.desc.toLowerCase().includes(search) && !t.id.toLowerCase().includes(search)) return false;
    return true;
  });
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / ROW_PP));
  if (page > totalPages) page = totalPages;
  const slice = filtered.slice((page-1)*ROW_PP, page*ROW_PP);
  const tbody = document.getElementById('txn-body');
  if (slice.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><span class="material-symbols-outlined">receipt_long</span><div class="empty-state-title">No transactions found</div><div class="empty-state-text">Try adjusting your filters</div></div></td></tr>';
  } else {
    tbody.innerHTML = slice.map((t,i) => {
      const rowClass = t.type === 'credit' ? 'tx-row-credit' : 'tx-row-debit';
      const amtClass = t.type === 'credit' ? 'amount-pos' : 'amount-neg';
      const amtSign = t.type === 'credit' ? '+' : '-';
      const typeColors = {credit:'badge-green',debit:'badge-red',transfer:'badge-teal'};
      return `<tr class="${rowClass}">
        <td class="td-mono">${String((page-1)*ROW_PP+i+1).padStart(2,'0')}</td>
        <td><div style="font-size:12px;font-weight:700;color:var(--text-primary)">${t.date}</div><div style="font-size:10px;color:var(--text-secondary)">${t.time}</div></td>
        <td><div style="font-size:13px;font-weight:600">${t.desc}</div><div class="td-mono">${t.id}</div></td>
        <td><span class="badge ${typeColors[t.type]||'badge-gray'}" style="text-transform:uppercase">${t.type}</span></td>
        <td class="${amtClass}">${amtSign}${formatINR(t.amount)}</td>
        <td style="font-size:12px;font-weight:700">${formatINR(t.balanceAfter)}</td>
        <td><span class="badge badge-green">Completed</span></td>
        <td><button class="btn btn-ghost btn-sm btn-icon-only" onclick="window.location.href='receipt.html?id=${t.id}'" title="View Receipt"><span class="material-symbols-outlined" style="font-size:16px">print</span></button></td>
      </tr>`;
    }).join('');
  }
  document.getElementById('txn-count').textContent = `${total} transaction${total !== 1 ? 's' : ''} found`;
  const s = (page-1)*ROW_PP+1, e = Math.min(page*ROW_PP, total);
  document.getElementById('pag-info').textContent = total ? `Showing ${s}–${e} of ${total}` : 'No results';
  const pn = document.getElementById('pag-nums');
  pn.innerHTML = `<button class="pag-btn" onclick="goPage(-1)" ${page<=1?'disabled':''}>← Prev</button>`;
  for(let i=1;i<=totalPages&&i<=5;i++) pn.innerHTML += `<button class="pag-num ${i===page?'active':''}" onclick="page=${i};renderTable()">${i}</button>`;
  pn.innerHTML += `<button class="pag-btn" onclick="goPage(1)" ${page>=totalPages?'disabled':''}>Next →</button>`;
}

function goPage(dir) { page = Math.max(1, Math.min(Math.ceil(filtered.length/ROW_PP), page+dir)); renderTable(); }
loadTransactions();
</script>
</body>
</html>
