<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Finzo — My Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#1a3c5e", "error": "#ba1a1a", "surface-container-low": "#0d1117" }, fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["Inter"] } } } }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <link rel="stylesheet" href="../../assets/css/user-panel.css">
  <link rel="stylesheet" href="../../assets/css/dark-mode.css">
  <script src="../../assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-surface-container-low font-body text-black dark:text-white antialiased">

  <div id="sidebar-placeholder"></div>

  <div class="admin-main">
    <div class="admin-topbar">
      <div>
        <div class="text-[10px] font-bold tracking-[0.2em] opacity-60 uppercase">SETTINGS</div>
        <div class="font-headline text-2xl font-extrabold tracking-tight">My Profile</div>
      </div>
      <div class="user-status-pill">
        <div class="dot"></div>
        <span>FINZO USER PANEL</span>
      </div>
    </div>

    <div style="padding:32px 36px;">

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Profile Card -->
        <div class="admin-card page-enter">
          <div class="p-8 text-center" style="background:linear-gradient(135deg,#1a3c5e,#2563eb);border-radius:20px 20px 0 0;">
            <div class="w-20 h-20 rounded-full bg-white/20 text-white flex items-center justify-center text-2xl font-black mx-auto mb-4 border-4 border-white/30">RK</div>
            <div class="text-xl font-black text-white font-headline">Rahul Kumar</div>
            <div class="text-xs text-white/60 font-bold mt-1">rahul.kumar@gmail.com</div>
          </div>
          <div class="p-6 space-y-4">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Account</span>
              <span class="font-bold font-mono text-sm dark:text-white">FNZ20260001</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Type</span>
              <span class="font-bold dark:text-white">Savings</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Status</span>
              <span class="status-badge badge-success">ACTIVE</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Member Since</span>
              <span class="font-bold dark:text-white">Jan 2026</span>
            </div>
            <div class="pt-4 border-t border-slate-100 dark:border-white/5">
              <a href="change-password.html" class="user-btn-secondary w-full no-underline" style="padding:10px !important;">
                <span class="material-symbols-outlined" style="font-size:16px;">lock</span> Change Password
              </a>
            </div>
          </div>
        </div>

        <!-- Edit Profile -->
        <div class="admin-card lg:col-span-2 page-enter page-enter-delay-1">
          <div class="p-6 border-b border-slate-100 dark:border-white/5">
            <h3 class="admin-section-title dark:text-white">Personal Information</h3>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Update your personal details.</p>
          </div>
          <div class="p-8">
            <form>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Full Name</label>
                  <input type="text" value="Rahul Kumar" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white outline-none" />
                </div>
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Email</label>
                  <input type="email" value="rahul.kumar@gmail.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 text-sm font-medium dark:text-white/60 outline-none cursor-not-allowed" readonly />
                </div>
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Phone Number</label>
                  <input type="tel" value="+91 98765 43210" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white outline-none" />
                </div>
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Date of Birth</label>
                  <input type="date" value="1998-05-15" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white outline-none" />
                </div>
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">PAN Number</label>
                  <input type="text" value="ABCPK1234F" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 text-sm font-medium dark:text-white/60 outline-none cursor-not-allowed uppercase" readonly />
                </div>
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Aadhaar Number</label>
                  <input type="text" value="XXXX XXXX 4567" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 text-sm font-medium dark:text-white/60 outline-none cursor-not-allowed" readonly />
                </div>
                <div class="md:col-span-2">
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Address</label>
                  <textarea rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white outline-none resize-none">42, Rajpur Road, New Delhi 110054</textarea>
                </div>
              </div>

              <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-slate-100 dark:border-white/5">
                <button type="button" class="user-btn-secondary" style="padding:12px 24px !important;">Cancel</button>
                <button type="submit" class="user-btn-primary" style="padding:12px 32px !important;">
                  <span class="material-symbols-outlined" style="font-size:18px;">save</span> Update Profile
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../../assets/js/component-loader.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
