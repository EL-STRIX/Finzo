<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Profile | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/user.css"/>
</head>
<body>
<script src="../../assets/js/user-shared.js"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>
<div class="page-content" style="max-width:800px; margin: 0 auto;">
<div class="page-header animate-in"><div class="page-eyebrow">Settings</div><div class="page-title">My Profile</div><div class="page-subtitle">Manage your personal information and account details</div></div>
<div class="form-grid form-grid-2" style="gap:20px">
<div class="card card-p animate-in animate-delay-1">
<div style="text-align:center;margin-bottom:24px">
<div style="position:relative;display:inline-block">
<div id="avatar-circle" style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;margin:0 auto">RK</div>
<button onclick="document.getElementById('avatar-input').click()" style="position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:var(--primary);border:2px solid var(--bg-card);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">
<span class="material-symbols-outlined" style="font-size:14px">photo_camera</span>
</button>
<input type="file" id="avatar-input" accept="image/*" style="display:none" onchange="handleAvatarChange(this)"/>
</div>
<div style="font-size:18px;font-weight:800;color:var(--text-primary);margin-top:12px" id="profile-name">Rahul Kumar</div>
<span class="badge badge-teal" style="margin-top:6px">Customer</span>
</div>
<div class="divider"></div>
<div class="card-title" style="margin-bottom:16px">Edit Information</div>
<div style="display:flex;flex-direction:column;gap:14px">
<div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-input" id="edit-name" placeholder="Your full name"/></div>
<div class="form-group"><label class="form-label">Phone Number</label><input type="text" class="form-input" id="edit-phone" placeholder="+91 98765 43210"/></div>
<div class="form-group"><label class="form-label">Email Address</label><input type="email" class="form-input" id="edit-email" placeholder="your@email.com"/></div>
<button class="btn btn-primary btn-full" onclick="saveProfile()">Save Changes</button>
</div>
</div>
<div>
<div class="card card-p animate-in animate-delay-2" style="margin-bottom:16px">
<div class="card-title" style="margin-bottom:14px">Account Information</div>
<div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text-secondary);font-weight:600">Account Number</span><span style="font-size:12px;font-weight:700;font-family:monospace" id="info-acc-no">—</span></div>
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text-secondary);font-weight:600">Account Type</span><span id="info-acc-type"><span class="badge badge-teal">Savings</span></span></div>
<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text-secondary);font-weight:600">Status</span><span id="info-status"><span class="badge badge-pending">Pending</span></span></div>
<div style="display:flex;justify-content:space-between;padding:10px 0"><span style="font-size:12px;color:var(--text-secondary);font-weight:600">Balance</span><span style="font-size:13px;font-weight:800;color:var(--primary)" id="info-balance">—</span></div>
</div>
</div>
<div class="card card-p animate-in animate-delay-3">
<div class="card-title" style="margin-bottom:14px">Quick Links</div>
<div style="display:flex;flex-direction:column;gap:8px">
<a href="change-password.html" style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;color:var(--text-primary);transition:var(--transition)" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
<span class="material-symbols-outlined" style="font-size:18px;color:var(--primary)">lock</span>
<span style="font-size:13px;font-weight:600">Change Password</span>
<span class="material-symbols-outlined" style="margin-left:auto;font-size:16px;color:var(--text-placeholder)">chevron_right</span>
</a>
<a href="notifications.html" style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:var(--radius-md);text-decoration:none;color:var(--text-primary);transition:var(--transition)" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
<span class="material-symbols-outlined" style="font-size:18px;color:var(--primary)">notifications</span>
<span style="font-size:13px;font-weight:600">Notifications</span>
<span class="material-symbols-outlined" style="margin-left:auto;font-size:16px;color:var(--text-placeholder)">chevron_right</span>
</a>
</div>
</div>
</div>
</div>
</div>
</div>
<script>
buildSidebar('profile'); buildNavbar('Settings','My Profile');
document.getElementById('edit-name').value = UserState.name;
document.getElementById('edit-phone').value = UserState.phone;
document.getElementById('edit-email').value = UserState.email;
document.getElementById('profile-name').textContent = UserState.name;
document.getElementById('avatar-circle').textContent = UserState.initials;
document.getElementById('info-acc-no').textContent = UserState.accountNo || 'Not Assigned';
document.getElementById('info-balance').textContent = UserState.isActive ? '₹'+parseFloat(UserState.balance).toLocaleString('en-IN',{minimumFractionDigits:2}) : '—';
const sMap = {pending:'badge-amber',under_review:'badge-teal',active:'badge-green',rejected:'badge-red'};
const sLabel = {pending:'Pending',under_review:'Under Review',active:'Active',rejected:'Rejected'};
document.getElementById('info-status').innerHTML = `<span class="badge ${sMap[UserState.status]||'badge-gray'}">${sLabel[UserState.status]||'Unknown'}</span>`;
function handleAvatarChange(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const c=document.getElementById('avatar-circle');c.style.backgroundImage=`url(${e.target.result})`;c.style.backgroundSize='cover';c.textContent='';};r.readAsDataURL(f);}
function saveProfile(){
const name=document.getElementById('edit-name').value.trim();
if(!name){showToast('Name cannot be empty','error');return;}
localStorage.setItem('finzo_user_name',name);
localStorage.setItem('finzo_user_phone',document.getElementById('edit-phone').value);
document.getElementById('profile-name').textContent=name;
document.getElementById('avatar-circle').textContent=name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
showToast('Profile updated successfully','success');
}
</script>
</body>
</html>
