<body class="bg-slate-50 dark:bg-surface font-body text-on-surface">
  <!-- Side Navigation Shell -->
  <!-- Modular Side Sidebar -->
  <div id="sidebar-placeholder"></div>
  <!-- Main Content Canvas -->
  <main class="md:ml-64 min-h-screen py-12 px-6 lg:px-16 flex flex-col items-center bg-slate-50 dark:bg-surface transition-all duration-300">
    <div class="w-full max-w-lg">
      <!-- Centered Header Section -->
      <header class="mb-10 text-center">
        <span class="text-blue-500 font-bold text-[10px] uppercase tracking-widest mb-3 block">Security Center</span>
        <h1 class="text-3xl font-extrabold dark:text-white tracking-tight mb-2">Change Password</h1>
        <p class="text-slate-500 dark:text-slate-400 max-w-xs mx-auto text-sm leading-relaxed">Update your credentials to keep your Finzo account secure.</p>
      </header>

      <!-- Centered Form Card -->
      <div class="bg-white dark:bg-[#0a0f1e] rounded-2xl p-8 shadow-xl shadow-slate-200/50 dark:shadow-none border border-slate-100 dark:border-slate-800 transition-colors">
        <form class="space-y-6">
          <!-- Current Password -->
          <div>
            <label class="block text-xs font-bold font-label text-on-surface-variant uppercase tracking-wider mb-2"
              for="current-password">Current Password</label>
            <div class="relative">
              <input
                class="w-full bg-slate-100 dark:bg-surface-container-low border-none rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary-container text-on-surface transition-all"
                id="current-password" placeholder="Enter existing password" type="password" />
              <span
                class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant cursor-pointer"
                data-icon="visibility">visibility</span>
            </div>
          </div>
          <hr class="border-outline-variant/10" />
          <!-- New Password -->
          <div>
            <label class="block text-xs font-bold font-label text-on-surface-variant uppercase tracking-wider mb-2"
              for="new-password">New Password</label>
            <div class="relative mb-4">
              <input
                class="w-full bg-slate-100 dark:bg-surface-container-low border-none rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary-container text-on-surface transition-all"
                id="new-password" placeholder="At least 8 characters" type="password" />
              <span
                class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant cursor-pointer"
                data-icon="visibility">visibility</span>
            </div>
            <!-- Strength Meter -->
            <div class="space-y-2">
              <div class="flex justify-between items-center px-1">
                <span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Strength</span>
                <span
                  class="text-[10px] font-bold text-on-tertiary-container uppercase tracking-widest">Sophisticated</span>
              </div>
              <div class="h-1 w-full bg-slate-200 dark:bg-surface-container flex gap-1 rounded-full overflow-hidden">
                <div class="h-full w-1/4 bg-tertiary-fixed-dim"></div>
                <div class="h-full w-1/4 bg-tertiary-fixed-dim"></div>
                <div class="h-full w-1/4 bg-tertiary-fixed-dim"></div>
                <div class="h-full w-1/4 bg-surface-variant"></div>
              </div>
            </div>
          </div>
          <!-- Confirm Password -->
          <div>
            <label class="block text-xs font-bold font-label text-on-surface-variant uppercase tracking-wider mb-2"
              for="confirm-password">Confirm New Password</label>
            <div class="relative">
              <input
                class="w-full bg-slate-100 dark:bg-surface-container-low border-none rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary-container text-on-surface transition-all"
                id="confirm-password" placeholder="Re-type new password" type="password" />
              <span
                class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant cursor-pointer"
                data-icon="visibility">visibility</span>
            </div>
          </div>
          <div class="pt-6">
            <button
              class="w-full py-3.5 px-6 bg-[#002645] dark:bg-blue-600 hover:bg-[#003366] dark:hover:bg-blue-500 text-white font-headline font-bold rounded-xl shadow-lg shadow-blue-900/10 dark:shadow-none active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2"
              type="submit">
              <span class="material-symbols-outlined text-xl">lock_open</span>
              <span>Update Password</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Mobile Navigation (Visible on mobile only) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white dark:bg-[#0a0f1e] border-t border-slate-100 dark:border-slate-800 flex items-center justify-around px-4 z-50">

      <span class="text-[10px]">Profile</span>
    </a>
    <a href="/views/user/change-password.html" class="flex flex-col items-center gap-1 text-primary dark:text-white no-underline">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">security</span>
