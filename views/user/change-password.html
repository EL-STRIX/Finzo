<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Change Password | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/user.css"/>
</head>
<body>
<script src="../../assets/js/user-shared.js"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>
<div class="page-content" style="max-width:520px;margin:auto;">
<div class="page-header animate-in"><div class="page-eyebrow">Security</div><div class="page-title">Change Password</div><div class="page-subtitle">Update your login credentials</div></div>
<div class="card card-p animate-in animate-delay-1">
<div style="display:flex;flex-direction:column;gap:20px">
<div class="form-group">
<label class="form-label">Current Password *</label>
<div class="input-wrap"><span class="input-icon material-symbols-outlined">lock</span><input type="password" class="form-input with-icon" id="current-pw" placeholder="Enter current password"/><button type="button" class="input-right" onclick="togglePw('current-pw','eye1')" style="background:none;border:none;cursor:pointer;color:var(--text-placeholder)"><span class="material-symbols-outlined" id="eye1" style="font-size:18px">visibility</span></button></div>
</div>
<div class="form-group">
<label class="form-label">New Password *</label>
<div class="input-wrap"><span class="input-icon material-symbols-outlined">lock_open</span><input type="password" class="form-input with-icon" id="new-pw" placeholder="Min 8 characters" oninput="checkStrength()"/><button type="button" class="input-right" onclick="togglePw('new-pw','eye2')" style="background:none;border:none;cursor:pointer;color:var(--text-placeholder)"><span class="material-symbols-outlined" id="eye2" style="font-size:18px">visibility</span></button></div>
<div class="strength-bar"><div class="strength-fill" id="strength-fill" style="width:0%"></div></div>
<div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:10px;color:var(--text-placeholder)">Password Strength</span><span style="font-size:10px;font-weight:700" id="strength-label"></span></div>
</div>
<div class="form-group">
<label class="form-label">Confirm New Password *</label>
<div class="input-wrap"><span class="input-icon material-symbols-outlined">lock_open</span><input type="password" class="form-input with-icon" id="confirm-pw" placeholder="Re-enter new password" oninput="checkMatch()"/><button type="button" class="input-right" onclick="togglePw('confirm-pw','eye3')" style="background:none;border:none;cursor:pointer;color:var(--text-placeholder)"><span class="material-symbols-outlined" id="eye3" style="font-size:18px">visibility</span></button></div>
<div id="match-error" class="hidden" style="font-size:11px;color:#f43f5e;margin-top:6px;font-weight:600">Passwords do not match</div>
</div>
<div class="banner banner-info" style="padding:12px 14px">
<div class="banner-left" style="gap:10px"><span class="material-symbols-outlined" style="color:#3b82f6;font-size:18px;flex-shrink:0">info</span><div style="font-size:12px;color:var(--text-secondary)">Password must be at least 8 characters with one uppercase letter, one number, and one special character.</div></div>
</div>
<button class="btn btn-primary btn-full btn-lg" onclick="updatePassword()" id="update-btn">
<span class="material-symbols-outlined" style="font-size:18px">lock_reset</span>Update Password
</button>
</div>
</div>
</div>
</div>
<script>
buildSidebar('change-password'); buildNavbar('Security','Change Password');
function togglePw(id,eyeId){const i=document.getElementById(id);const e=document.getElementById(eyeId);if(i.type==='password'){i.type='text';e.textContent='visibility_off';}else{i.type='password';e.textContent='visibility';}}
function checkStrength(){const pw=document.getElementById('new-pw').value;const fill=document.getElementById('strength-fill');const label=document.getElementById('strength-label');let score=0;if(pw.length>=8)score++;if(/[A-Z]/.test(pw))score++;if(/[0-9]/.test(pw))score++;if(/[^A-Za-z0-9]/.test(pw))score++;const configs={0:{w:'0%',c:'#ef4444',l:''},1:{w:'25%',c:'#ef4444',l:'Weak'},2:{w:'50%',c:'#f59e0b',l:'Fair'},3:{w:'75%',c:'#f59e0b',l:'Good'},4:{w:'100%',c:'#10b981',l:'Strong'}};const cfg=configs[score];fill.style.width=cfg.w;fill.style.background=cfg.c;label.textContent=cfg.l;label.style.color=cfg.c;}
function checkMatch(){const np=document.getElementById('new-pw').value;const cp=document.getElementById('confirm-pw').value;const err=document.getElementById('match-error');if(cp&&np!==cp)err.classList.remove('hidden');else err.classList.add('hidden');}
function updatePassword(){
const cur=document.getElementById('current-pw').value;
const np=document.getElementById('new-pw').value;
const cp=document.getElementById('confirm-pw').value;
if(!cur||!np||!cp){showToast('Please fill in all fields','error');return;}
if(np.length<8){showToast('Password must be at least 8 characters','error');return;}
if(np!==cp){showToast('Passwords do not match','error');return;}
// Real API password change
const btn=document.getElementById('update-btn');
btn.disabled=true;btn.innerHTML='<span class="material-symbols-outlined spin" style="font-size:18px">autorenew</span> Updating...';
fetch('/api/user/change-password.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:'current_password='+encodeURIComponent(cur)+'&new_password='+encodeURIComponent(np)+'&confirm_password='+encodeURIComponent(cp)}).then(r=>r.json()).then(data=>{if(data.success){showToast('Password updated successfully! Redirecting...','success');setTimeout(()=>{window.location.href='../auth/login.html';},2000);}else{showToast(data.message||'Update failed','error');btn.disabled=false;btn.innerHTML='<span class="material-symbols-outlined" style="font-size:18px">lock_reset</span>Update Password';}}).catch(()=>{showToast('Connection error','error');btn.disabled=false;btn.innerHTML='<span class="material-symbols-outlined" style="font-size:18px">lock_reset</span>Update Password';});}
</script>
</body>
</html>
