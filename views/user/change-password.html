<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Finzo — Change Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#1a3c5e", "error": "#ba1a1a", "surface-container-low": "#0d1117" }, fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["Inter"] } } } }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <link rel="stylesheet" href="../../assets/css/user-panel.css">
  <link rel="stylesheet" href="../../assets/css/dark-mode.css">
  <script src="../../assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-surface-container-low font-body text-black dark:text-white antialiased">

  <div id="sidebar-placeholder"></div>

  <div class="admin-main">
    <div class="admin-topbar">
      <div>
        <div class="text-[10px] font-bold tracking-[0.2em] opacity-60 uppercase">SECURITY</div>
        <div class="font-headline text-2xl font-extrabold tracking-tight">Change Password</div>
      </div>
      <div class="user-status-pill">
        <div class="dot"></div>
        <span>FINZO USER PANEL</span>
      </div>
    </div>

    <div style="padding:32px 36px;">
      <div class="max-w-xl mx-auto">

        <!-- Security Info -->
        <div class="admin-card mb-6 page-enter">
          <div class="p-6 flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-blue-100 dark:bg-blue-500/10 text-blue-600 flex items-center justify-center flex-shrink-0">
              <span class="material-symbols-outlined text-2xl">shield</span>
            </div>
            <div>
              <div class="font-bold dark:text-white text-sm">Password Security</div>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Choose a strong password with at least 8 characters, including uppercase, lowercase, numbers, and special characters.</p>
            </div>
          </div>
        </div>

        <!-- Change Password Form -->
        <div class="admin-card page-enter page-enter-delay-1">
          <div class="p-6 border-b border-slate-100 dark:border-white/5">
            <h3 class="admin-section-title dark:text-white">Update Password</h3>
          </div>
          <div class="p-8">
            <form id="password-form">
              <div class="space-y-6">
                <!-- Current Password -->
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Current Password *</label>
                  <div class="relative">
                    <input type="password" id="current-pw" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white outline-none pr-12" placeholder="Enter current password" required />
                    <button type="button" onclick="togglePw('current-pw')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
                      <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                  </div>
                </div>

                <!-- New Password -->
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">New Password *</label>
                  <div class="relative">
                    <input type="password" id="new-pw" oninput="checkStrength()" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white outline-none pr-12" placeholder="Enter new password" required />
                    <button type="button" onclick="togglePw('new-pw')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
                      <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                  </div>
                  <!-- Strength Meter -->
                  <div class="mt-3">
                    <div class="admin-progress" style="height:4px;">
                      <div class="admin-progress-fill" id="strength-bar" style="width:0%;background:#ef4444;transition:all 0.3s;"></div>
                    </div>
                    <div class="text-[10px] font-bold mt-1" id="strength-text" style="color:#94a3b8;">Enter a password</div>
                  </div>
                </div>

                <!-- Confirm Password -->
                <div>
                  <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Confirm New Password *</label>
                  <div class="relative">
                    <input type="password" id="confirm-pw" oninput="checkMatch()" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white outline-none pr-12" placeholder="Re-enter new password" required />
                    <button type="button" onclick="togglePw('confirm-pw')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors">
                      <span class="material-symbols-outlined text-xl">visibility</span>
                    </button>
                  </div>
                  <div id="match-msg" class="text-[10px] font-bold mt-1" style="display:none;"></div>
                </div>
              </div>

              <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-slate-100 dark:border-white/5">
                <a href="profile.html" class="user-btn-secondary no-underline" style="padding:12px 24px !important;">Cancel</a>
                <button type="submit" class="user-btn-primary" style="padding:12px 32px !important;">
                  <span class="material-symbols-outlined" style="font-size:18px;">lock_reset</span> Update Password
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../../assets/js/component-loader.js"></script>
  <script src="../../assets/js/main.js"></script>

  <script>
    function togglePw(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function checkStrength() {
      const pw = document.getElementById('new-pw').value;
      const bar = document.getElementById('strength-bar');
      const text = document.getElementById('strength-text');
      let score = 0;
      if (pw.length >= 8) score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;

      const levels = [
        { width: '0%', color: '#94a3b8', label: 'Enter a password' },
        { width: '25%', color: '#ef4444', label: 'Weak' },
        { width: '50%', color: '#f59e0b', label: 'Fair' },
        { width: '75%', color: '#2563eb', label: 'Good' },
        { width: '100%', color: '#10b981', label: 'Strong' }
      ];

      bar.style.width = levels[score].width;
      bar.style.background = levels[score].color;
      text.textContent = levels[score].label;
      text.style.color = levels[score].color;

      checkMatch();
    }

    function checkMatch() {
      const pw = document.getElementById('new-pw').value;
      const cpw = document.getElementById('confirm-pw').value;
      const msg = document.getElementById('match-msg');
      if (!cpw) { msg.style.display = 'none'; return; }
      msg.style.display = 'block';
      if (pw === cpw) {
        msg.textContent = '✓ Passwords match';
        msg.style.color = '#10b981';
      } else {
        msg.textContent = '✗ Passwords do not match';
        msg.style.color = '#ef4444';
      }
    }
  </script>
</body>
</html>
