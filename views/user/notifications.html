<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notifications | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/user.css"/>
<link rel="stylesheet" href="../../assets/css/user-panel.css"/>
<style>
  /* Professional Notifications Design */
  .notif-container { max-width: 1140px; margin: 0 auto; }
  
  .notif-grid-premium { 
    display: grid; grid-template-columns: 340px 1fr; gap: 32px; 
    margin-top: 24px;
  }
  
  @media (max-width: 1024px) {
    .notif-grid-premium { grid-template-columns: 1fr; gap: 24px; }
  }

  /* Management Sidebar */
  .notif-sidebar-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-xl); padding: 24px; position: sticky; top: 80px;
  }
  
  /* Notification Item Redesign */
  .notif-ledger-item {
    display: flex; align-items: flex-start; gap: 20px; padding: 20px 28px;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: var(--transition);
    position: relative; overflow: hidden;
  }
  .notif-ledger-item:last-child { border-bottom: none; }
  .notif-ledger-item:hover { background: var(--bg-input); }
  
  .notif-ledger-item.unread { background: rgba(8, 145, 178, 0.03); }
  .notif-ledger-item.unread::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary);
  }

  .notif-icon-box {
    width: 44px; height: 44px; border-radius: 12px; display: flex; 
    align-items: center; justify-content: center; flex-shrink: 0;
  }

  /* Filter Chips Premium */
  .filter-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  .filter-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-radius: var(--radius-lg); border: 1px solid transparent;
    cursor: pointer; transition: var(--transition); font-size: 13px; font-weight: 700; color: var(--text-secondary);
  }
  .filter-item:hover { background: var(--bg-input); color: var(--text-primary); }
  .filter-item.active { background: var(--primary-light); color: var(--primary); border-color: var(--primary-light); }
  .filter-count { font-size: 10px; opacity: 0.6; background: var(--border); padding: 2px 8px; border-radius: 10px; }

  @media (max-width: 480px) {
    .notif-ledger-item { padding: 16px 20px; gap: 14px; }
    .notif-icon-box { width: 36px; height: 36px; }
    .filter-stack { flex-direction: row; flex-wrap: wrap; }
    .filter-item { padding: 8px 14px; flex-grow: 1; justify-content: center; }
  }
</style>
</head>
<body>
<script src="../../assets/js/user-shared.js"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>

<div class="page-content">
  <div class="notif-container">
    <div class="page-header animate-in" style="display:flex; justify-content:space-between; align-items:flex-end">
      <div>
        <div class="page-eyebrow">Communication Center</div>
        <h1 class="page-title">Activity Feed</h1>
        <p class="page-subtitle">Unified broadcast from the Finzo ecosystem</p>
      </div>
      <button onclick="markAllRead()" class="btn btn-outline btn-sm no-print" style="margin-bottom:8px">Mark all as acknowledged</button>
    </div>

    <div class="notif-grid-premium">
      <!-- LEFT: MANAGEMENT SIDEBAR -->
      <div class="animate-in animate-delay-1">
        <div class="notif-sidebar-card">
          <div style="font-size:11px; font-weight:800; color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.1em; margin-bottom:16px">Signal Distribution</div>
          
          <div style="padding:16px; background:var(--bg-input); border-radius:var(--radius-lg); border:1px solid var(--border); margin-bottom:24px">
            <div style="font-size:10px; font-weight:800; color:var(--text-secondary); margin-bottom:4px">UNREAD ALERTS</div>
            <div style="font-size:24px; font-weight:800; color:var(--primary)" id="unread-stat">0</div>
          </div>

          <div class="filter-stack">
            <div class="filter-item active" onclick="filterNotifs('all',this)">
              <div style="display:flex; align-items:center; gap:10px"><span class="material-symbols-outlined" style="font-size:18px">grid_view</span> All Broadcasts</div>
              <span class="filter-count" id="count-all">0</span>
            </div>
            <div class="filter-item" onclick="filterNotifs('transaction',this)">
              <div style="display:flex; align-items:center; gap:10px"><span class="material-symbols-outlined" style="font-size:18px">payments</span> Transactions</div>
              <span class="filter-count" id="count-transaction">0</span>
            </div>
            <div class="filter-item" onclick="filterNotifs('security',this)">
              <div style="display:flex; align-items:center; gap:10px"><span class="material-symbols-outlined" style="font-size:18px">security</span> Security</div>
              <span class="filter-count" id="count-security">0</span>
            </div>
            <div class="filter-item" onclick="filterNotifs('system',this)">
              <div style="display:flex; align-items:center; gap:10px"><span class="material-symbols-outlined" style="font-size:18px">settings</span> System</div>
              <span class="filter-count" id="count-system">0</span>
            </div>
          </div>

          <div style="margin-top:32px; padding-top:24px; border-top:1px dashed var(--border)">
            <button onclick="clearAll()" class="btn btn-ghost btn-full" style="color:var(--danger)">
              <span class="material-symbols-outlined">delete_sweep</span> Purge All Records
            </button>
          </div>
        </div>
      </div>

      <!-- RIGHT: NOTIFICATION LIST -->
      <div class="animate-in animate-delay-2">
        <div class="card" style="overflow:hidden; min-height:400px">
          <div id="notif-container"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- View Notification Modal -->
<div id="viewNotifModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div id="viewNotifIcon" class="modal-icon"></div>
    <div id="viewNotifTitle" class="modal-title">Broadcast Subject</div>
    <div id="viewNotifDate" style="text-align:center; font-size:11px; font-weight:700; color:var(--text-placeholder); margin-bottom:24px; text-transform:uppercase; letter-spacing:0.05em">TIMESTAMP</div>
    <div id="viewNotifBody" class="modal-text" style="text-align:left; font-size:14px; color:var(--text-primary); line-height:1.7; padding:24px; background:var(--bg-input); border-radius:var(--radius-xl); border:1px solid var(--border)">
      Message body content.
    </div>
    <div class="modal-actions" style="margin-top:32px; display:flex; gap:12px;">
      <button class="btn btn-ghost" onclick="closeModal('viewNotifModal')" style="flex:1">Acknowledge</button>
      <button class="btn btn-danger" onclick="deleteCurrentNotif()" style="flex:1">Delete Record</button>
    </div>
  </div>
</div>

<script>
  (async function initPage() {
    await fetchUserSession();
    buildSidebar('notifications'); buildNavbar('Activity', 'Notifications');
  })();
  let activeFilter = 'all';
  let notifs = [];

  // Load notifications from API
  async function loadNotifications() {
    try {
      const res = await fetch('../../api/user/notifications.php', { credentials: 'same-origin' });
      const data = await res.json();
      if (data.success && data.notifications) {
        notifs = data.notifications.map((n, i) => ({
          id: n.id || i + 1,
          type: n.type || 'system',
          icon: n.icon || 'notifications',
          iconBg: n.icon_bg || 'rgba(8,145,178,0.1)',
          iconColor: n.icon_color || '#0891b2',
          title: n.title,
          body: n.body || n.message,
          time: n.created_at ? new Date(n.created_at).toLocaleString('en-IN', {day:'numeric',month:'short',year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true}) : 'Recently',
          unread: !n.is_read
        }));
      }
    } catch (e) { console.warn('Failed to load notifications:', e); }
    renderNotifs();
  }

  function renderNotifs() {
    const filtered = notifs.filter(n => activeFilter === 'all' || n.type === activeFilter);
    const container = document.getElementById('notif-container');
    const unreadCount = notifs.filter(n => n.unread).length;
    
    document.getElementById('unread-stat').textContent = unreadCount;
    document.getElementById('count-all').textContent = notifs.length;
    document.getElementById('count-transaction').textContent = notifs.filter(n=>n.type==='transaction').length;
    document.getElementById('count-security').textContent = notifs.filter(n=>n.type==='security').length;
    document.getElementById('count-system').textContent = notifs.filter(n=>n.type==='system').length;

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-state" style="padding:80px 0">
        <span class="material-symbols-outlined" style="font-size:64px; color:var(--text-placeholder); margin-bottom:20px">notifications_off</span>
        <div class="empty-state-title">Quiet Environment</div>
        <div class="empty-state-text">No active broadcasts found for this segment.</div>
      </div>`;
      return;
    }

    container.innerHTML = filtered.map(n => `
      <div class="notif-ledger-item ${n.unread ? 'unread' : ''}" onclick="viewNotif(${n.id})">
        <div class="notif-icon-box" style="background:${n.iconBg}">
          <span class="material-symbols-outlined" style="font-size:20px; color:${n.iconColor}">${n.icon}</span>
        </div>
        <div style="flex:1">
          <div style="display:flex; justify-content:space-between; align-items:flex-start">
            <div style="font-size:14px; font-weight:800; color:var(--text-primary); margin-bottom:4px">
              ${n.title} ${n.unread ? '<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--primary); margin-left:8px; vertical-align:middle"></span>' : ''}
            </div>
            <div style="font-size:10px; font-weight:700; color:var(--text-placeholder); text-transform:uppercase; letter-spacing:0.04em">${n.time}</div>
          </div>
          <div style="font-size:12px; color:var(--text-secondary); line-height:1.6; max-width:600px">${n.body}</div>
        </div>
      </div>`).join('');
  }

  let currentViewNotifId = null;

  function viewNotif(id) {
    const n = notifs.find(x => x.id === id);
    if (n) {
      n.unread = false;
      currentViewNotifId = id;
      document.getElementById('viewNotifTitle').textContent = n.title;
      document.getElementById('viewNotifBody').textContent = n.body;
      document.getElementById('viewNotifDate').textContent = n.time;

      const iconContainer = document.getElementById('viewNotifIcon');
      iconContainer.style.background = n.iconBg;
      iconContainer.innerHTML = `<span class="material-symbols-outlined" style="font-size:32px; color:${n.iconColor}">${n.icon}</span>`;

      // Mark as read on backend
      fetch('../../api/user/notifications.php', { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, credentials: 'same-origin', body: 'action=mark_read&notification_id=' + id }).catch(() => {});
      
      renderNotifs();
      openModal('viewNotifModal');
    }
  }

  function deleteCurrentNotif() {
    if (currentViewNotifId !== null) {
      fetch('../../api/user/notifications.php', { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, credentials: 'same-origin', body: 'action=delete&notification_id=' + currentViewNotifId }).catch(() => {});
      notifs = notifs.filter(n => n.id !== currentViewNotifId);
      currentViewNotifId = null;
      renderNotifs();
      closeModal('viewNotifModal');
      showToast('Record purged from ledger', 'success');
    }
  }

  function markAllRead() {
    fetch('../../api/user/notifications.php', { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, credentials: 'same-origin', body: 'action=mark_all_read' }).catch(() => {});
    notifs.forEach(n => n.unread = false);
    renderNotifs();
    showToast('All broadcasts acknowledged', 'success');
  }

  function clearAll() {
    openConfirm('Purge All Records', 'This action will permanently remove all notifications from your signal ledger. Proceed?', () => {
      fetch('../../api/user/notifications.php', { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, credentials: 'same-origin', body: 'action=clear_all' }).catch(() => {});
      notifs = [];
      renderNotifs();
      showToast('Activity feed cleared', 'success');
    }, false);
  }

  function filterNotifs(type, el) {
    activeFilter = type;
    document.querySelectorAll('.filter-item').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderNotifs();
  }

  loadNotifications();
</script>
</body>
</html>
