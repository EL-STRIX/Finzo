<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Finzo — Complete Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { "primary": "#1a3c5e", "error": "#ba1a1a", "surface-container-low": "#0d1117" }, fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["Inter"] } } } }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <link rel="stylesheet" href="../../assets/css/user-panel.css">
  <link rel="stylesheet" href="../../assets/css/dark-mode.css">
  <script src="../../assets/js/theme.js"></script>
</head>
<body class="bg-slate-50 dark:bg-surface-container-low font-body text-black dark:text-white antialiased">

  <div id="sidebar-placeholder"></div>

  <div class="admin-main">
    <div class="admin-topbar">
      <div>
        <div class="text-[10px] font-bold tracking-[0.2em] opacity-60 uppercase">PROFILE SETUP</div>
        <div class="font-headline text-2xl font-extrabold tracking-tight">Complete Profile</div>
      </div>
      <div class="user-status-pill">
        <div class="dot"></div>
        <span>FINZO USER PANEL</span>
      </div>
    </div>

    <div style="padding:32px 36px;">

      <!-- Progress Steps -->
      <div class="admin-card mb-8 page-enter">
        <div class="p-6">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Step 1 of 3</span>
            <span class="text-xs font-bold text-blue-600">33% Complete</span>
          </div>
          <div class="admin-progress mb-6">
            <div class="admin-progress-fill" style="width:33%;background:linear-gradient(90deg,#1a3c5e,#2563eb);"></div>
          </div>
          <div class="flex justify-between">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">1</div>
              <span class="text-xs font-bold text-blue-600">Personal Info</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-white/10 text-slate-500 dark:text-white/40 flex items-center justify-center text-xs font-bold">2</div>
              <span class="text-xs font-bold text-slate-400">Identity</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-white/10 text-slate-500 dark:text-white/40 flex items-center justify-center text-xs font-bold">3</div>
              <span class="text-xs font-bold text-slate-400">Review</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Card -->
      <div class="admin-card page-enter page-enter-delay-1">
        <div class="p-6 border-b border-slate-100 dark:border-white/5">
          <h3 class="admin-section-title dark:text-white">Personal Information</h3>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Please fill in your details to complete account verification.</p>
        </div>
        <div class="p-8">
          <form id="profile-form">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Full Name *</label>
                <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all" placeholder="Enter your full name" required />
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Date of Birth *</label>
                <input type="date" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all" required />
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Phone Number *</label>
                <input type="tel" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all" placeholder="+91 00000 00000" required />
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">PAN Number *</label>
                <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all uppercase" placeholder="ABCDE1234F" maxlength="10" required />
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Aadhaar Number *</label>
                <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all" placeholder="0000 0000 0000" maxlength="14" required />
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Gender *</label>
                <select class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all" required>
                  <option value="">Select Gender</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">Address *</label>
                <textarea rows="3" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all resize-none" placeholder="Enter your full address" required></textarea>
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">City *</label>
                <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all" placeholder="e.g. New Delhi" required />
              </div>
              <div>
                <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 block">PIN Code *</label>
                <input type="text" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-white/10 bg-white dark:bg-white/5 text-sm font-medium dark:text-white focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 outline-none transition-all" placeholder="110001" maxlength="6" required />
              </div>
            </div>

            <div class="flex justify-end gap-4 mt-8 pt-6 border-t border-slate-100 dark:border-white/5">
              <a href="dashboard.html" class="user-btn-secondary no-underline" style="padding:12px 24px !important;">Cancel</a>
              <button type="submit" class="user-btn-primary" style="padding:12px 32px !important;">
                <span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span> Continue to Step 2
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../../assets/js/component-loader.js"></script>
  <script src="../../assets/js/main.js"></script>
</body>
</html>
