<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Beneficiaries | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../assets/css/user.css"/>
</head>
<body>
<script src="../../assets/js/user-shared.js"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>
<div class="page-content">
<div class="page-header animate-in" style="display:flex;justify-content:space-between;align-items:flex-end">
<div><div class="page-eyebrow">Banking</div><div class="page-title">Beneficiaries</div><div class="page-subtitle">Manage your saved transfer recipients</div></div>
<!-- <button onclick="openModal('add-modal')" class="btn btn-primary"><span class="material-symbols-outlined" style="font-size:18px">add</span>Add Beneficiary</button> -->
</div>

<style>
.beneficiary-grid { display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
@media(max-width:1024px) { .beneficiary-grid { grid-template-columns: 1fr; } }
</style>
<div class="beneficiary-grid">
<!-- LIST -->
<div class="card animate-in animate-delay-1" style="overflow:hidden">
<div style="padding:16px 20px;border-bottom:1px solid var(--border);background:var(--bg-input)">
<div style="font-size:13px;font-weight:800;color:var(--text-primary);letter-spacing:0.08em;text-transform:uppercase">Saved Beneficiaries</div>
</div>
<div id="beneficiary-list"></div>
</div>

<!-- ADD FORM -->
<div class="card card-p animate-in animate-delay-2" style="height:fit-content">
<div class="card-title" style="margin-bottom:4px">Add New Beneficiary</div>
<div style="font-size:12px;color:var(--text-secondary);margin-bottom:16px">Save an account for quick future transfers</div>
<div style="display:flex;flex-direction:column;gap:14px">
<div class="form-group"><label class="form-label">Nick Name *</label><input type="text" class="form-input" id="new-nick" placeholder="e.g. Mom, Office Rent"/></div>
<div class="form-group">
<label class="form-label">Account Number *</label>
<div style="display:flex;gap:8px"><input type="text" class="form-input" id="new-acc" placeholder="e.g. FNZ20260002" style="flex:1;font-family:monospace"/><button class="btn btn-outline" onclick="lookupBen()"><span class="material-symbols-outlined" style="font-size:18px">search</span></button></div>
<div id="ben-result" class="hidden" style="margin-top:8px;font-size:12px;font-weight:700;color:#10b981"></div>
</div>
<div class="form-group"><label class="form-label">Bank Name</label><input type="text" class="form-input" id="new-bank" value="Finzo Banking System" readonly style="color:var(--text-secondary)"/></div>
<button class="btn btn-primary btn-full" onclick="addBeneficiary()">Save Beneficiary</button>
</div>
</div>
</div>
</div>
</div>

<script>
buildSidebar('beneficiary'); buildNavbar('Banking','Beneficiaries');
handleStatusRedirect('beneficiary');

const demoAccounts={'FNZ20260002':'Priya Sharma','FNZ20260003':'Amit Mondal','FNZ20260004':'Sunita Mehta','FNZ20260005':'Vikram Gupta'};
let beneficiaries=JSON.parse(localStorage.getItem('finzo_beneficiaries')||'[]');
if(!beneficiaries.length) beneficiaries=[{id:1,nick:'Priya Sharma',account:'FNZ20260002',holder:'Priya Sharma',bank:'Finzo Banking System',added:'12 Apr 2026'},{id:2,nick:'Amit Mondal',account:'FNZ20260003',holder:'Amit Mondal',bank:'Finzo Banking System',added:'12 Apr 2026'}];

let verifiedHolder='';
function lookupBen(){const acc=document.getElementById('new-acc').value.trim().toUpperCase();const res=document.getElementById('ben-result');if(!acc)return;if(demoAccounts[acc]){verifiedHolder=demoAccounts[acc];res.textContent='✅ '+verifiedHolder;res.style.color='#10b981';res.classList.remove('hidden');}else{verifiedHolder='';res.textContent='❌ Account not found';res.style.color='#f43f5e';res.classList.remove('hidden');}}
function addBeneficiary(){
const nick=document.getElementById('new-nick').value.trim();
const acc=document.getElementById('new-acc').value.trim().toUpperCase();
if(!nick||!acc){showToast('Please fill in all fields','error');return;}
if(!verifiedHolder){showToast('Please verify the account number first','error');return;}
beneficiaries.push({id:Date.now(),nick,account:acc,holder:verifiedHolder,bank:'Finzo Banking System',added:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})});
localStorage.setItem('finzo_beneficiaries',JSON.stringify(beneficiaries));
document.getElementById('new-nick').value='';document.getElementById('new-acc').value='';document.getElementById('ben-result').classList.add('hidden');verifiedHolder='';
showToast('Beneficiary saved successfully','success');renderList();}
function deleteBen(id){openConfirm('Remove Beneficiary','Are you sure you want to remove this beneficiary?',()=>{beneficiaries=beneficiaries.filter(b=>b.id!==id);localStorage.setItem('finzo_beneficiaries',JSON.stringify(beneficiaries));renderList();showToast('Beneficiary removed','success');},true);}
function renderList(){
const list=document.getElementById('beneficiary-list');
if(!beneficiaries.length){list.innerHTML='<div class="empty-state"><span class="material-symbols-outlined">group</span><div class="empty-state-title">No saved beneficiaries</div><div class="empty-state-text">Add your first beneficiary using the form on the right.</div></div>';return;}
list.innerHTML=beneficiaries.map(b=>`
<div style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);transition:background 0.15s" onmouseover="this.style.background='var(--bg-input)'" onmouseout="this.style.background='transparent'">
<div style="width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0">${b.nick.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase()}</div>
<div style="flex:1">
<div style="font-size:14px;font-weight:700;color:var(--text-primary)">${b.nick}</div>
<div style="font-size:11px;color:var(--text-secondary);margin-top:2px;font-family:monospace">${b.account}</div>
<div style="font-size:10px;color:var(--text-placeholder);margin-top:2px">Added ${b.added}</div>
</div>
<div style="display:flex;gap:6px">
<a href="transfer.html" class="btn btn-primary btn-sm">Transfer</a>
<button class="btn btn-ghost btn-sm btn-icon-only" onclick="deleteBen(${b.id})" title="Remove"><span class="material-symbols-outlined" style="font-size:16px">delete</span></button>
</div>
</div>`).join('');}
renderList();
</script>
</body>
</html>
