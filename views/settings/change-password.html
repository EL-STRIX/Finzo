<main class="ml-64 min-h-screen p-8 md:p-12 lg:p-16 flex flex-col items-center bg-surface">
<div class="w-full max-w-4xl">
<!-- Header Section -->
<header class="mb-12">
<span class="text-on-tertiary-container font-label text-xs font-bold tracking-[0.2em] uppercase mb-2 block">Security Management</span>
<h1 class="text-4xl font-extrabold font-headline text-primary tracking-tight">Change Password</h1>
<p class="text-on-surface-variant mt-3 max-w-xl font-body leading-relaxed">
                    Update your account security credentials. We recommend using a unique password that you don't use elsewhere.
                </p>
</header>
<!-- Architectural Layout -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
<!-- Left: Focused Form -->
<section class="lg:col-span-7">
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-sm border border-outline-variant/10">
<form class="space-y-6">
<!-- Current Password -->
<div>
<label class="block text-xs font-bold font-label text-on-surface-variant uppercase tracking-wider mb-2" for="current-password">Current Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" id="current-password" placeholder="Enter existing password" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant cursor-pointer" data-icon="visibility">visibility</span>
</div>
</div>
<hr class="border-outline-variant/10"/>
<!-- New Password -->
<div>
<label class="block text-xs font-bold font-label text-on-surface-variant uppercase tracking-wider mb-2" for="new-password">New Password</label>
<div class="relative mb-4">
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" id="new-password" placeholder="At least 12 characters" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant cursor-pointer" data-icon="visibility">visibility</span>
</div>
<!-- Strength Meter -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<span class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Strength</span>
<span class="text-[10px] font-bold text-on-tertiary-container uppercase tracking-widest">Sophisticated</span>
</div>
<div class="h-1 w-full bg-surface-container flex gap-1 rounded-full overflow-hidden">
<div class="h-full w-1/4 bg-tertiary-fixed-dim"></div>
<div class="h-full w-1/4 bg-tertiary-fixed-dim"></div>
<div class="h-full w-1/4 bg-tertiary-fixed-dim"></div>
<div class="h-full w-1/4 bg-surface-variant"></div>
</div>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block text-xs font-bold font-label text-on-surface-variant uppercase tracking-wider mb-2" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3.5 focus:ring-2 focus:ring-primary-container text-on-surface transition-all" id="confirm-password" placeholder="Re-type new password" type="password"/>
</div>
</div>
