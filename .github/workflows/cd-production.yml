name: Production Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://finzo.example.com
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies (No Dev)
      run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader --ignore-platform-req=php

    - name: Compress Build Artifact
      run: tar -czf ../release.tar.gz . && mv ../release.tar.gz .
      
    - name: Copy Artifact to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.PROD_SERVER_IP }}
        username: ${{ secrets.PROD_SERVER_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        source: "release.tar.gz"
        target: "/var/www/finzo/deployments/"
        
    - name: Execute Deployment Script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SERVER_IP }}
        username: ${{ secrets.PROD_SERVER_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /var/www/finzo/deployments/
          tar -xzf release.tar.gz ops/deploy.sh
          bash ops/deploy.sh production release.tar.gz
