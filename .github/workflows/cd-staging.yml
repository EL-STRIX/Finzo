name: Staging Deployment

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment:
      name: Staging
      url: https://staging.finzo.example.com
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Dependencies
      run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

    - name: Compress Build Artifact
      run: tar -czf release.tar.gz .
      
    - name: Copy Artifact to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.STAGING_SERVER_IP }}
        username: ${{ secrets.STAGING_SERVER_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        source: "release.tar.gz"
        target: "/var/www/finzo-staging/deployments/"
        
    - name: Execute Deployment Script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.STAGING_SERVER_IP }}
        username: ${{ secrets.STAGING_SERVER_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /var/www/finzo-staging/deployments/
          tar -xzf release.tar.gz ops/deploy.sh
          bash ops/deploy.sh staging release.tar.gz
