name: Enterprise API CI/CD

on:
  push:
    branches: [ "main", "develop", "release/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: finzo_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: pdo, pdo_mysql, zip, gd
        coverage: pcov

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Prepare Test Environment
      run: |
        if [ ! -f .env.testing ]; then cp .env.example .env.testing; fi
        sed -i 's/DB_PASS=.*/DB_PASS=root/g' .env.testing
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/g' .env.testing

    - name: Execute Enterprise API Test Suite
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: root
      run: vendor/bin/phpunit --coverage-clover=coverage.xml

    - name: Check Coverage Thresholds
      run: |
        php bin/check-coverage.php coverage.xml 25