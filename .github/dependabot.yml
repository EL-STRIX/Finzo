version: 2
updates:
  # Scan Composer dependencies weekly
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "php"
    open-pull-requests-limit: 10

  # Scan GitHub Actions daily
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
