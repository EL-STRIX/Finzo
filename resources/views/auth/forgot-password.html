<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Finzo | Recovery Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <link href="/Finzo/public/assets/css/design-system.css" rel="stylesheet"/>
    <script src="/Finzo/public/assets/js/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="/Finzo/public/assets/css/custom.css">
</head>
<body class="bg-background font-body text-[var(--color-text-main)] antialiased">
<main class="min-h-screen flex items-stretch">
    <!-- Left Column: Visual Branding -->
    <section class="hidden lg:flex lg:w-1/2 relative flex-col justify-between p-10 xl:p-16 overflow-hidden" style="background: linear-gradient(135deg, rgba(10,20,40,0.88) 0%, rgba(26,60,94,0.75) 100%);">
        <div class="relative z-10">
            <div class="flex items-center gap-2 mb-16 xl:mb-20">
                <span class="text-2xl xl:text-3xl font-black tracking-tighter text-white font-headline cursor-pointer" onclick="window.location.href='/Finzo/public/index.html'">Finzo</span>
            </div>
            <div class="max-w-md text-white">
                <p class="font-headline text-4xl xl:text-5xl font-bold leading-tight mb-6">Recovery <br/>Access.</p>
                <p class="text-white/80 text-base xl:text-lg leading-relaxed">Re-establish security protocols for your institutional ledger through our precision identity layer.</p>
            </div>
        </div>
        <div class="relative z-10 flex gap-4 text-white/40 text-xs font-headline tracking-widest uppercase">
            <span>Identity Verification Required</span>
        </div>
        <div class="absolute inset-0 z-0 pointer-events-none">
            <img alt="Modern Architecture" class="w-full h-full object-cover brightness-[0.35] contrast-[1.1]" src="/Finzo/public/assets/images/forget-password-page-image.png" loading="lazy">
            <div class="absolute inset-0 bg-primary-600/30 mix-blend-multiply"></div>
        </div>
    </section>

    <!-- Right Column: Recovery Form -->
    <section class="w-full lg:w-1/2 flex flex-col justify-center items-center px-5 py-10 sm:p-8 md:p-16 lg:p-20 xl:p-24 bg-background">
        <div class="w-full max-w-md">

            <!-- Mobile Branding -->
            <div class="md:hidden flex items-center justify-center gap-2 mb-6">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-primary-600/10">
                    <span class="material-symbols-outlined text-primary-600 text-lg">account_balance</span>
                </div>
                <span class="text-xl font-black tracking-tighter text-primary-600 font-headline">Finzo</span>
            </div>

            <div class="mb-8 sm:mb-10 lg:mb-12">
                <h2 class="text-2xl sm:text-3xl font-headline font-bold text-primary-600 tracking-tight mb-2">Password Recovery</h2>
                <p class="text-[var(--color-text-muted)] font-medium text-sm sm:text-base">Verify your identity to re-establish secure access.</p>
            </div>

            <!-- Institutional Error Banner -->
            <div id="error-box" class="error-msg text-center font-bold mb-4"></div>

            <form class="ds-card p-6 md:p-8 space-y-6 fade-in-up" action="#" class="space-y-6 sm:space-y-8 fade-in-up" method="POST">
                <div class="space-y-4">
                    <div class="fin-input-container">
                        <label class="field-label ml-1">Email Address</label>
                        <div class="relative">
                            <span class="material-symbols-outlined input-icon">mail</span>
                            <input class="fin-input has-icon-left" placeholder="sujaypaul123@gmail.com" type="email" required/>
                        </div>
                    </div>
                </div>

                <div class="pt-3 sm:pt-4">
                    <button class="btn-primary" type="submit">
                        <span>Send Recovery Key</span>
                        <span class="material-symbols-outlined text-xl">key</span>
                    </button>
                    <a href="login.html" class="mt-6 sm:mt-8 w-full flex items-center justify-center gap-2 text-sm font-bold text-[var(--color-text-muted)] hover:text-primary-600 transition-colors">
                        <span class="material-symbols-outlined text-lg">arrow_back</span>
                        Back to Login
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/Finzo/public/assets/js/public/public-shared.js"></script>
<script>
$(function() {
    $('form').on('submit', function(e) {
        e.preventDefault();
        const email = $(this).find('input[type="email"]').val().trim();
        const $btn = $(this).find('button[type="submit"]');

        if (!email) {
            $('#error-box').text('Please enter your email address.').show();
            return;
        }

        const original = $btn.html();
        $btn.prop('disabled', true).html('<span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span> <span>Sending...</span>');
        $('#error-box').hide();

        fetch('/Finzo/api/auth/forgot-password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            credentials: 'same-origin',
            body: 'email=' + encodeURIComponent(email)
        })
        .then(res => res.json())
        .then(data => {
            $btn.prop('disabled', false).html(original);
            // Always show success message (security: don't reveal if email exists)
            const btn2 = $btn.html('<span class="material-symbols-outlined">check_circle</span> <span>Sent Successfully</span>').addClass('bg-green-600').removeClass('bg-primary-600');
            setTimeout(() => window.location.href = 'login.html', 3000);
        })
        .catch(err => {
            $btn.prop('disabled', false).html(original);
            $('#error-box').text('Network error. Please try again.').show();
        });
    });
});
</script>
</body>
</html>
