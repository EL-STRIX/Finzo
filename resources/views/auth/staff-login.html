<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Finzo | Staff Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/Finzo/public/assets/js/tailwind-config.js"></script>
  <link href="/Finzo/public/assets/css/main.css" rel="stylesheet"/>
  </head>
  </head>
<body class="bg-[var(--color-surface-subtle)] font-body text-[var(--color-text-main)] antialiased overflow-x-hidden">
<main class="auth-layout-container">
  
  <!-- Brand Header -->
  <div class="auth-brand-header">
    <div class="auth-brand-logo-container cursor-pointer bg-primary-50 text-primary-600" data-href="/Finzo/public/index.html">
      <span class="material-symbols-outlined text-2xl">support_agent</span>
    </div>
    <h1 class="auth-hero-title">Staff Banking Portal</h1>
    <p class="auth-subtitle">Internal banking operations and customer service</p>
  </div>

  <!-- Auth Card -->
  <div class="auth-card-wrapper">

    <!-- Role Switcher -->
    <div class="flex bg-slate-50/80 p-1 rounded-md mb-8 border border-slate-200">
      <button data-href="login.html" class="flex-1 text-center py-2 text-xs font-medium text-slate-500 hover:text-slate-800 rounded transition-all">Customer</button>
      <button data-href="staff-login.html" class="flex-1 text-center py-2 text-[11px] font-extrabold uppercase tracking-widest text-white bg-primary-600 rounded shadow-sm transition-all">Staff</button>
      <button data-href="admin-login.html" class="flex-1 text-center py-2 text-xs font-medium text-slate-500 hover:text-slate-800 rounded transition-all">Admin</button>
    </div>

    <!-- Institutional Error Banner -->
    <div id="error-box" class="error-msg text-center font-bold mb-4"></div>

    <form class="auth-form-body" novalidate id="staffLoginForm">
      <!-- Field: Staff ID -->
      <div class="fin-input-container !mb-0">
        <label for="identity" class="form-label">Staff ID or Email</label>
        <div class="relative mt-2">
          <span class="material-symbols-outlined input-icon">badge</span>
          <input id="identity" type="text" placeholder="e.g. STF001 or name@finzobank.com" class="fin-input has-icon-left" required aria-required="true" />
        </div>
      </div>

      <!-- Field: Password -->
      <div class="fin-input-container !mb-0 mt-4">
        <label for="password" class="form-label">Network Password</label>
        <div class="relative group mt-2">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input id="password" type="password" placeholder="••••••••••••" class="fin-input has-icon-left has-icon-right" required aria-required="true" />
          <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary-600 transition-colors focus:outline-none focus:text-primary-600" id="toggle-password" aria-label="Toggle password visibility">
            <span class="material-symbols-outlined text-[20px]">visibility</span>
          </button>
        </div>
      </div>

      <!-- Action -->
      <div class="pt-5">
        <button type="submit" id="login-btn" class="btn btn-primary w-full">
          <span>Access Operations Portal</span>
          <span class="material-symbols-outlined text-xl">login</span>
        </button>
      </div>
      
      <div class="mt-6 text-center">
        <a href="login.html" class="text-[12px] font-semibold text-slate-500 hover:text-primary-800 transition-colors">Customer Portal? Login here →</a>
      </div>
    </form>

    <div class="auth-trust-badge mt-8 border-t border-slate-100 pt-6">
      <span class="material-symbols-outlined text-[14px]">assured_workload</span>
      <span>Authorized Employee Access Only</span>
    </div>

  </div>

  <!-- Global Footer -->
  <div class="auth-global-footer">
    <ul>
      <li><a href="#">Employee Guidelines</a></li>
      <li><a href="#">Report Security Incident</a></li>
      <li><a href="#">IT Helpdesk</a></li>
    </ul>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="/Finzo/public/assets/js/core/utils.js"></script>
  <script src="/Finzo/public/assets/js/core/api.js"></script>
</body>
</html>
