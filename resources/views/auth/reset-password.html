<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Finzo | Reset Security Key</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <script src="/Finzo/public/assets/js/tailwind-config.js"></script>
  <link href="/Finzo/public/assets/css/main.css" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    </head>
<body class="bg-[var(--color-surface-subtle)] font-body text-[var(--color-text-main)] antialiased overflow-x-hidden">
<main class="auth-layout-container">
  
  <!-- Brand Header -->
  <div class="auth-brand-header">
    <div class="auth-brand-logo-container cursor-pointer" data-href="/Finzo/public/index.html">
      <span class="material-symbols-outlined text-2xl">account_balance</span>
    </div>
    <h1 class="auth-hero-title">Establish New Credentials</h1>
    <p class="auth-subtitle">Configure a new secure password for your banking profile.</p>
  </div>

  <!-- Auth Card -->
  <div class="auth-card-wrapper">

    <!-- Institutional Error Banner -->
    <div id="error-box" class="error-msg text-center font-bold mb-4"></div>

    <form class="auth-form-body" action="#" method="POST">
      
      <div class="fin-input-container !mb-0">
          <label class="form-label">New Password</label>
          <div class="relative group mt-2">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input class="fin-input has-icon-left has-icon-right" placeholder="Create a strong password" type="password" required aria-required="true" />
              <!-- We add the visibility toggle here as well as requested for usability -->
              <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary-600 transition-colors focus:outline-none focus:text-primary-600" aria-label="Toggle password visibility">
                  <span class="material-symbols-outlined text-[20px]">visibility</span>
              </button>
          </div>
      </div>
      
      <div class="fin-input-container !mb-0 mt-3">
          <label class="form-label">Confirm Password</label>
          <div class="relative mt-2">
              <span class="material-symbols-outlined input-icon">verified_user</span>
              <input class="fin-input has-icon-left" placeholder="Repeat your new password" type="password" required aria-required="true" />
          </div>
      </div>

      <div class="pt-2">
          <button class="btn btn-primary w-full" type="submit">
              <span>Update Security Credentials</span>
              <span class="material-symbols-outlined text-xl">lock_reset</span>
          </button>
      </div>

    </form>

    <div class="auth-trust-badge">
      <span class="material-symbols-outlined text-[14px]">shield</span>
      <span>Banking Grade Password Encryption</span>
    </div>

    <div class="auth-footer">
        <a href="login.html" class="flex items-center justify-center gap-1 font-semibold text-slate-500 hover:text-primary-800 transition-colors">
            <span class="material-symbols-outlined text-lg">arrow_back</span>
            Return to Sign In
        </a>
    </div>
  </div>

  <!-- Global Footer -->
  <div class="auth-global-footer">
    <ul>
      <li><a href="#">Privacy Policy</a></li>
      <li><a href="#">Security Center</a></li>
      <li><a href="#">Terms of Service</a></li>
      <li><a href="#">Contact Support</a></li>
    </ul>
  </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/Finzo/public/assets/js/public/public-shared.js"></script>

<script src="/Finzo/public/assets/js/core/utils.js"></script>
  <script src="/Finzo/public/assets/js/core/api.js"></script>
</body>
</html>
