<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Finzo | Reset Security Key</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <link href="/Finzo/public/assets/css/design-system.css" rel="stylesheet"/>
    <script src="/Finzo/public/assets/js/tailwind-config.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="/Finzo/public/assets/css/custom.css">
</head>
<body class="bg-background font-body text-[var(--color-text-main)] antialiased">
<main class="min-h-screen flex items-stretch">
    <!-- Left Column: Visual Branding -->
    <section class="hidden lg:flex lg:w-1/2 relative flex-col justify-between p-10 xl:p-16 overflow-hidden" style="background: linear-gradient(135deg, rgba(10,20,40,0.88) 0%, rgba(26,60,94,0.75) 100%);">
        <div class="relative z-10">
            <div class="flex items-center gap-2 mb-16 xl:mb-20">
                <span class="text-2xl xl:text-3xl font-black tracking-tighter text-white font-headline cursor-pointer" onclick="window.location.href='../../../public/index.html'">Finzo</span>
            </div>
            <div class="max-w-md text-white">
                <p class="font-headline text-4xl xl:text-5xl font-bold leading-tight mb-6">Reset <br/>Ciphers.</p>
                <p class="text-white/80 text-base xl:text-lg leading-relaxed">Establish a new cryptographic key for your institutional wealth management portal.</p>
            </div>
        </div>
        <div class="absolute inset-0 z-0 pointer-events-none">
            <img alt="Interior Architecture" class="w-full h-full object-cover brightness-[0.35] contrast-[1.1]" src="/Finzo/public/assets/images/reset-password-page-image.png" loading="lazy"/>
            <div class="absolute inset-0 bg-primary-600/30 mix-blend-multiply"></div>
        </div>
    </section>

    <!-- Right Column: Reset Form -->
    <section class="w-full lg:w-1/2 flex flex-col justify-center items-center px-5 py-10 sm:p-8 md:p-16 lg:p-20 xl:p-24 bg-background">
        <div class="w-full max-w-md">

            <!-- Mobile Branding -->
            <div class="md:hidden flex items-center justify-center gap-2 mb-6">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-primary-600/10">
                    <span class="material-symbols-outlined text-primary-600 text-lg">account_balance</span>
                </div>
                <span class="text-xl font-black tracking-tighter text-primary-600 font-headline">Finzo</span>
            </div>

            <div class="mb-8 sm:mb-10 lg:mb-12">
                <h2 class="text-2xl sm:text-3xl font-headline font-bold text-primary-600 tracking-tight mb-2">Reset Password</h2>
                <p class="text-[var(--color-text-muted)] font-medium text-sm sm:text-base">Define your new architectural access key.</p>
            </div>

            <!-- Institutional Error Banner -->
            <div id="error-box" class="error-msg text-center font-bold mb-4"></div>

            <form class="ds-card p-6 md:p-8 space-y-6 fade-in-up" action="#" class="space-y-5 sm:space-y-6 fade-in-up" method="POST">
                <div class="space-y-4">
                    <div class="fin-input-container">
                        <label class="field-label ml-1">New Security Cipher</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined input-icon">lock</span>
                            <input class="fin-input has-icon-left" placeholder="••••••••••••" type="password" required/>
                        </div>
                    </div>
                    <div class="fin-input-container" style="animation-delay: 0.1s;">
                        <label class="field-label ml-1">Confirm Cipher</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined input-icon">verified_user</span>
                            <input class="fin-input has-icon-left" placeholder="••••••••••••" type="password" required/>
                        </div>
                    </div>
                </div>

                <div class="pt-3 sm:pt-4">
                    <button class="btn-primary" type="submit" style="animation-delay: 0.2s;">
                        <span>Initialize Key Update</span>
                        <span class="material-symbols-outlined text-xl">lock_reset</span>
                    </button>
                    <a href="login.html" class="mt-6 sm:mt-8 w-full flex items-center justify-center gap-2 text-sm font-bold text-[var(--color-text-muted)] hover:text-primary-600 transition-colors">
                        <span class="material-symbols-outlined text-lg">arrow_back</span>
                        Back to Login
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="/Finzo/public/assets/js/public/public-shared.js"></script>
<script>
$(function() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    $('form').on('submit', function(e) {
        e.preventDefault();
        const inputs = $(this).find('input[type="password"]');
        const newPassword = $(inputs[0]).val();
        const confirmPassword = $(inputs[1]).val();
        const $btn = $(this).find('button[type="submit"]');
        if (!newPassword || !confirmPassword) {
            $('#error-box').text('Both password fields are required.').show();
            return;
        }

        if (newPassword !== confirmPassword) {
            $('#error-box').text('Passwords do not match.').show();
            return;
        }

        if (newPassword.length < 8) {
            $('#error-box').text('Password must be at least 8 characters.').show();
            return;
        }

        const original = $btn.html();
        $btn.prop('disabled', true).html('<span class="material-symbols-outlined animate-spin text-[16px]">progress_activity</span> <span>Resetting...</span>');
        $('#error-box').hide();

        fetch('/Finzo/api/auth/reset-password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            credentials: 'same-origin',
            body: 'token=' + encodeURIComponent(token) +
                  '&new_password=' + encodeURIComponent(newPassword) +
                  '&confirm_password=' + encodeURIComponent(confirmPassword)
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                $btn.html('<span class="material-symbols-outlined">check_circle</span> <span>Reset Successful</span>').addClass('bg-green-600').removeClass('bg-primary-600');
                setTimeout(() => window.location.href = 'login.html', 2000);
            } else {
                $('#error-box').text(data.message || 'Reset failed. Please try again.').show();
                $btn.prop('disabled', false).html(original);
            }
        })
        .catch(() => {
            $('#error-box').text('Connection error. Please try again.').show();
            $btn.prop('disabled', false).html(original);
        });
    });
});
</script>
</body>
</html>
