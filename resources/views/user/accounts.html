<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Accounts | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script defer src="https://cdn.tailwindcss.com"></script>
<script defer src="/Finzo/public/assets/js/tailwind-config.js"></script>
  <link href="/Finzo/public/assets/css/main.css" rel="stylesheet"/>
    <script defer src="/Finzo/public/assets/js/core/ui-components.js"></script>
</head>
<body class="bg-[var(--color-surface-subtle)] font-body text-[var(--color-text-main)] antialiased">
<script defer src="/Finzo/public/assets/js/user/user-shared.js?v=3"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>

<div class="page-content ds-container py-8">
  <!-- Standard Page Header -->
  <div class="mb-8 ds-animate-fade">
    <div class="text-sm font-bold text-[var(--color-text-muted)] uppercase tracking-wider mb-1">Banking</div>
    <h1 class="font-display text-3xl font-extrabold text-[var(--color-text-main)] tracking-tight">My Accounts</h1>
    <p class="text-[var(--color-text-muted)] mt-1">Unified portfolio and active wealth containers.</p>
  </div>

  <div class="w-full max-w-4xl mx-auto flex flex-col gap-8 ds-animate-slide-up">
    
    <!-- SPECIFIC ACCOUNTS -->
    <div class="ds-card border-none bg-transparent shadow-none p-0 overflow-visible">
      <div class="ds-card p-0 overflow-hidden relative shadow-md group">
        
        <!-- Premium Header -->
        <div class="p-5 sm:p-6 bg-[var(--color-surface-subtle)] border-b border-[var(--color-border-main)] flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-primary-surface text-primary-base-base flex items-center justify-center shrink-0 shadow-sm">
              <span class="material-symbols-outlined text-2xl">account_balance</span>
            </div>
            <div>
              <div class="font-display font-bold text-[var(--color-text-main)]" id="acc-type-name">Finzo Platinum Savings</div>
              <div class="text-xs font-bold text-[var(--color-text-muted)] tracking-wide">Primary Wealth Container</div>
            </div>
          </div>
          <span class="ds-badge ds-badge-success text-xs tracking-widest uppercase">ACTIVE</span>
        </div>
        
        <!-- Card Body -->
        <div class="p-6 sm:p-8 bg-white relative">
          <!-- Revolut-style absolute decoration -->
          <div class="absolute -top-12 -right-12 w-32 h-32 bg-[var(--color-surface-subtle)] rounded-full blur-2xl opacity-50 pointer-events-none"></div>

          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-6 mb-8 relative z-10">
            <div>
              <div class="text-xs font-bold text-[var(--color-text-muted)] uppercase tracking-widest mb-2">Ledger Balance</div>
              <div class="font-display text-4xl sm:text-5xl font-black text-primary-base-600 tracking-tighter" id="acc-balance">₹0.00</div>
            </div>
            <div class="sm:text-right w-full sm:w-auto p-4 sm:p-0 rounded-lg sm:rounded-none bg-[var(--color-surface-subtle)] sm:bg-transparent border sm:border-none border-[var(--color-border-main)]">
              <div class="text-xs font-bold text-[var(--color-text-muted)] uppercase tracking-widest mb-1">Reference</div>
              <div class="font-mono text-base font-bold text-[var(--color-text-main)] tracking-wider" id="acc-no">FNZ — — —</div>
            </div>
          </div>

          <!-- Meta Grid -->
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4 pt-6 border-t border-[var(--color-border-main)] relative z-10">
            <div class="p-3 rounded-lg hover:bg-[var(--color-surface-subtle)] transition-colors">
              <div class="text-[10px] font-bold text-[var(--color-text-muted)] uppercase tracking-widest mb-1">Opened date</div>
              <div class="font-bold text-[var(--color-text-main)]" id="acc-opened">—</div>
            </div>
            <div class="p-3 rounded-lg hover:bg-[var(--color-surface-subtle)] transition-colors">
              <div class="text-[10px] font-bold text-[var(--color-text-muted)] uppercase tracking-widest mb-1">Interest APY</div>
              <div class="font-bold text-[var(--color-text-main)]" id="acc-interest">—</div>
            </div>
            <div class="p-3 rounded-lg hover:bg-[var(--color-surface-subtle)] transition-colors col-span-2 md:col-span-1">
              <div class="text-[10px] font-bold text-[var(--color-text-muted)] uppercase tracking-widest mb-1">Daily Limit</div>
              <div class="font-bold text-[var(--color-text-main)]" id="acc-limit">—</div>
            </div>
          </div>

          <!-- Actions -->
          <div class="mt-8 pt-6 border-t border-[var(--color-border-main)] flex flex-col sm:flex-row gap-4 relative z-10">
            <a href="account-detail.html" class="btn btn-secondary flex-1 group">
              <span class="material-symbols-outlined text-[var(--color-text-muted)] group-hover:text-[var(--color-text-main)] transition-colors">analytics</span> 
              Analytics & Details
            </a>
            <a href="transfer.html" class="btn btn-primary flex-1">
              <span class="material-symbols-outlined">send</span> 
              Send Money
            </a>
          </div>
        </div>
      </div>
      
    </div>
  </div>
</div>


<script defer src="/Finzo/public/assets/js/core/utils.js"></script>
  <script defer src="/Finzo/public/assets/js/core/api.js"></script>
</body>
</html>
