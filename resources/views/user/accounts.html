<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Accounts | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../../public/assets/css/user.css"/>
<link rel="stylesheet" href="../../../public/assets/css/user-panel.css"/>
<style>
  /* Professional Accounts Design with Full Responsiveness */
  .accounts-container { max-width: 1140px; margin: 0 auto; }
  
  /* Grid Layout */
  .accounts-grid-premium { 
    display: grid; grid-template-columns: 360px 1fr; gap: 28px; 
    margin-top: 24px;
  }
  
  @media (max-width: 1024px) {
    .accounts-grid-premium { grid-template-columns: 1fr; gap: 20px; }
  }

  /* Portfolio Summary Card */
  .portfolio-summary-card {
    background: linear-gradient(135deg, var(--sidebar-bg), #1e293b);
    color: #fff; border-radius: var(--radius-xl); padding: 28px;
    position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
  }
  .portfolio-summary-card::after {
    content: "ASSETS"; position: absolute; top: 10px; right: 10px; 
    font-size: 32px; font-weight: 900; opacity: 0.03; font-style: italic;
  }

  /* Account Card Redesign */
  .premium-account-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-xl); padding: 0; overflow: hidden;
    transition: var(--transition);
  }
  .premium-account-card:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: var(--shadow-hover); }
  
  .account-card-header { 
    background: var(--bg-input); padding: 18px 24px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .account-card-body { padding: 24px; }
  
  .account-meta-grid { 
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; 
    margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); 
  }
  
  @media (max-width: 480px) {
    .account-card-header { padding: 14px 16px; flex-wrap: wrap; }
    .account-card-body { padding: 20px 16px; }
    .account-meta-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .meta-item:last-child { grid-column: span 2; border-top: 1px dashed var(--border); padding-top: 8px; }
    .balance-display { font-size: 24px !important; }
  }

  .meta-item-label { font-size: 10px; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .meta-item-value { font-size: 13px; font-weight: 700; color: var(--text-primary); }

  /* Banking Tiles */
  .banking-action-tile {
    display: flex; align-items: center; gap: 16px; padding: 16px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); color: var(--text-primary);
    transition: var(--transition);
  }
  .banking-action-tile:hover { border-color: var(--primary); background: var(--bg-input); }
  .action-tile-icon {
    width: 44px; height: 44px; border-radius: 12px; display: flex; 
    align-items: center; justify-content: center; flex-shrink: 0;
  }
</style>
</head>
<body>
<script src="../../../assets/js/user/user-shared.js?v=3"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>

<div class="page-content">
  <div class="accounts-container">
    <!-- Standard Page Header -->
    <div class="page-header animate-in">
      <div class="page-eyebrow">Banking</div>
      <h1 class="page-title">My Accounts</h1>
      <p class="page-subtitle">Unified portfolio and active wealth containers</p>
    </div>

    <div style="max-width:800px; margin: 0 auto; display:flex; flex-direction:column; gap:24px;">


      <!-- SPECIFIC ACCOUNTS -->
      <div class="animate-in animate-delay-1">
        <div class="premium-account-card">
          <div class="account-card-header">
            <div style="display:flex; align-items:center; gap:12px">
              <span class="material-symbols-outlined" style="color:var(--primary); font-size:24px">account_balance</span>
              <div>
                <div style="font-size:14px; font-weight:800; color:var(--text-primary)" id="acc-type-name">Finzo Platinum Savings</div>
                <div style="font-size:11px; color:var(--text-secondary); font-weight:600">Primary Wealth Container</div>
              </div>
            </div>
            <span class="badge badge-green" style="padding:4px 12px; font-size:10px; letter-spacing:0.05em">ACTIVE</span>
          </div>
          
          <div class="account-card-body">
            <div style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:15px">
              <div>
                <div style="font-size:10px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; margin-bottom:6px">Ledger Balance</div>
                <div style="font-size:32px; font-weight:800; color:var(--primary)" id="acc-balance" class="balance-display">₹0.00</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:10px; font-weight:800; color:var(--text-secondary); text-transform:uppercase; margin-bottom:4px">Reference</div>
                <div style="font-size:15px; font-weight:700; font-family:'Courier New', monospace" id="acc-no">FNZ — — —</div>
              </div>
            </div>

            <div class="account-meta-grid">
              <div class="meta-item">
                <div class="meta-item-label">Opened date</div>
                <div class="meta-item-value" id="acc-opened">—</div>
              </div>
              <div class="meta-item">
                <div class="meta-item-label">INTEREST APY</div>
                <div class="meta-item-value" id="acc-interest">—</div>
              </div>
              <div class="meta-item">
                <div class="meta-item-label">DAILY LIMIT</div>
                <div class="meta-item-value" id="acc-limit">—</div>
              </div>
            </div>

            <div style="margin-top:28px; display:flex; gap:12px">
              <a href="account-detail.html" class="btn btn-primary" style="flex:1; height:44px; display:flex; align-items:center; justify-content:center">
                <span class="material-symbols-outlined" style="font-size:20px; margin-right:8px">analytics</span> Analytics
              </a>
              <a href="transfer.html" class="btn btn-outline" style="flex:1; height:44px; display:flex; align-items:center; justify-content:center">
                <span class="material-symbols-outlined" style="font-size:20px; margin-right:8px">send</span> Send
              </a>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>

<script>
  (async function() {
    try {
      await fetchUserSession();
      buildSidebar('accounts'); buildNavbar('Banking','My Accounts');
      handleStatusRedirect('accounts');
      const realBalance = formatINR(UserState.balance);
      const balEls = [document.getElementById('acc-balance')];
      
      balEls.forEach(el => {
        if (!el) return;
        if (UserState.isBalanceUnlocked) {
          el.textContent = realBalance;
        } else {
          el.textContent = '₹ ••••';
          el.classList.add('balance-hidden-mask');
          el.setAttribute('data-real-value', realBalance);
        }
      });

      document.getElementById('acc-no').textContent = (UserState.accountNo || 'NOT ASSIGNED').replace(/(.{4})/g, '$1 ').trim();

      // Populate Account Meta Data
      const openedDate = new Date(UserState.openedDate);
      const dateStr = !isNaN(openedDate) ? openedDate.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}).toUpperCase() : '—';
      const accOpenedEl = document.getElementById('acc-opened');
      if (accOpenedEl) accOpenedEl.textContent = dateStr;
      
      const accInterestEl = document.getElementById('acc-interest');
      if (accInterestEl) accInterestEl.textContent = UserState.interestRate + '% p.a.';
      
      const accLimitEl = document.getElementById('acc-limit');
      if (accLimitEl) accLimitEl.textContent = '₹' + parseInt(UserState.dailyLimit).toLocaleString('en-IN');
      
      const accTypeMap = { 'savings': 'Finzo Platinum Savings', 'current': 'Finzo Current Account' };
      const accNameEl = document.getElementById('acc-type-name');
      if (accNameEl) accNameEl.textContent = accTypeMap[UserState.accountType] || 'Finzo Account';
    } catch (err) {
      document.body.innerHTML += `<div style="position:fixed;top:0;left:0;background:red;color:white;z-index:99999;padding:20px;font-size:20px;width:100%;">${err.stack}</div>`;
    }
  })();
</script>
</body>
</html>
