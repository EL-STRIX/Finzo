<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notifications | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link href="../../../public/assets/css/design-system.css" rel="stylesheet"/>
<script src="../../../public/assets/js/tailwind-config.js"></script>
<link rel="stylesheet" href="../../../public/assets/css/user.css"/>
<link rel="stylesheet" href="../../../public/assets/css/user-panel.css"/>
</head>
<body class="bg-[var(--color-surface-subtle)] font-body text-[var(--color-text-main)] antialiased">
<script src="../../../public/assets/js/user/user-shared.js"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>

<div class="page-content ds-container py-8">
  <div class="flex justify-between items-end mb-8 ds-animate-fade">
    <div>
      <div class="text-sm font-bold text-[var(--color-text-muted)] uppercase tracking-wider mb-1">Communication Center</div>
      <h1 class="font-display text-3xl font-extrabold text-[var(--color-text-main)] tracking-tight">Activity Feed</h1>
      <p class="text-[var(--color-text-muted)] mt-1">Unified broadcast from the Finzo ecosystem.</p>
    </div>
    <button onclick="markAllRead()" class="btn btn-secondary btn-sm no-print mb-1">Mark all as read</button>
  </div>

  <div class="flex flex-col lg:flex-row gap-8">
    <!-- LEFT: FILTERS SIDEBAR -->
    <div class="w-full lg:w-1/4 ds-animate-slide-up">
      <div class="ds-card sticky top-24">
        <div class="ds-card-body p-6">
          <div class="text-xs font-bold text-[var(--color-text-muted)] uppercase tracking-widest mb-4">Signal Distribution</div>
          
          <!-- UNREAD ALERTS BUBBLE -->
          <div class="p-4 rounded-xl bg-primary-surface border border-primary-base/20 mb-6 flex flex-col items-center justify-center text-center">
            <div class="text-[10px] font-bold text-primary-base uppercase tracking-widest mb-1">Unread Alerts</div>
            <div class="font-display text-4xl font-black text-primary-base" id="unread-stat">0</div>
          </div>

          <!-- FILTERS -->
          <div class="flex flex-col gap-2">
            <button class="filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-primary-base bg-primary-surface" onclick="filterNotifs('all',this)">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-lg">grid_view</span> All Broadcasts
              </div>
              <span class="text-xs py-0.5 px-2 rounded-full bg-white/50 border border-primary-base/10" id="count-all">0</span>
            </button>
            
            <button class="filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-[var(--color-text-muted)] hover:bg-[var(--color-surface-subtle)] hover:text-[var(--color-text-main)]" onclick="filterNotifs('transaction',this)">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-lg">payments</span> Transactions
              </div>
              <span class="text-xs py-0.5 px-2 rounded-full bg-[var(--color-border-main)]/50" id="count-transaction">0</span>
            </button>
            
            <button class="filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-[var(--color-text-muted)] hover:bg-[var(--color-surface-subtle)] hover:text-[var(--color-text-main)]" onclick="filterNotifs('security',this)">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-lg">security</span> Security
              </div>
              <span class="text-xs py-0.5 px-2 rounded-full bg-[var(--color-border-main)]/50" id="count-security">0</span>
            </button>
            
            <button class="filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-[var(--color-text-muted)] hover:bg-[var(--color-surface-subtle)] hover:text-[var(--color-text-main)]" onclick="filterNotifs('system',this)">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-lg">settings</span> System
              </div>
              <span class="text-xs py-0.5 px-2 rounded-full bg-[var(--color-border-main)]/50" id="count-system">0</span>
            </button>
          </div>

          <div class="mt-8 pt-6 border-t border-dashed border-[var(--color-border-main)]">
            <button onclick="clearAll()" class="w-full flex items-center justify-center gap-2 p-3 text-sm font-bold text-danger-base hover:bg-danger-surface rounded-lg transition-colors">
              <span class="material-symbols-outlined">delete_sweep</span> Delete All Records
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: NOTIFICATION FEED -->
    <div class="w-full lg:w-3/4 ds-animate-slide-up" style="animation-delay: 0.1s;">
      <div class="ds-card min-h-[400px]">
        <div id="notif-container" class="flex flex-col">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- View Notification Modal -->
<div id="viewNotifModal" class="modal-overlay hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="ds-card max-w-md w-full p-6 animate-in zoom-in-95 duration-200">
    <div id="viewNotifIcon" class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center mb-4"></div>
    <div id="viewNotifTitle" class="font-display text-xl font-bold text-center text-[var(--color-text-main)] mb-1">Broadcast Subject</div>
    <div id="viewNotifDate" class="text-center text-xs font-bold text-[var(--color-text-muted)] uppercase tracking-wider mb-6">TIMESTAMP</div>
    
    <div id="viewNotifBody" class="p-4 rounded-xl bg-[var(--color-surface-subtle)] border border-[var(--color-border-main)] text-sm text-[var(--color-text-main)] leading-relaxed mb-6">
      Message body content.
    </div>
    
    <div class="flex gap-4">
      <button class="btn btn-secondary flex-1" onclick="closeModal('viewNotifModal')">Read</button>
      <button class="btn btn-danger flex-1" onclick="deleteCurrentNotif()">Delete Record</button>
    </div>
  </div>
</div>

<script>
  (async function initPage() {
    await fetchUserSession();
    buildSidebar('notifications'); buildNavbar('Activity', 'Notifications');
  })();
  let activeFilter = 'all';
  let notifs = [];

  async function loadNotifications() {
    try {
      const res = await fetch('../../../app/Controllers/user/notifications.php', { credentials: 'same-origin' });
      const data = await res.json();
      if (data.success && data.notifications) {
        notifs = data.notifications.map((n, i) => ({
          id: n.id || i + 1,
          type: n.type || 'system',
          icon: n.icon || 'notifications',
          iconBg: n.icon_bg || 'bg-info-surface',
          iconColor: n.icon_color || 'text-info-base',
          title: n.title,
          body: n.body || n.message,
          time: n.created_at ? new Date(n.created_at).toLocaleString('en-IN', {day:'numeric',month:'short',year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true}) : 'Recently',
          unread: !n.is_read
        }));
      }
    } catch (e) { console.warn('Failed to load notifications:', e); }
    renderNotifs();
  }

  function renderNotifs() {
    const filtered = notifs.filter(n => activeFilter === 'all' || n.type === activeFilter);
    const container = document.getElementById('notif-container');
    const unreadCount = notifs.filter(n => n.unread).length;
    
    document.getElementById('unread-stat').textContent = unreadCount;
    document.getElementById('count-all').textContent = notifs.length;
    document.getElementById('count-transaction').textContent = notifs.filter(n=>n.type==='transaction').length;
    document.getElementById('count-security').textContent = notifs.filter(n=>n.type==='security').length;
    document.getElementById('count-system').textContent = notifs.filter(n=>n.type==='system').length;

    if (filtered.length === 0) {
      container.innerHTML = `<div class="p-16 flex flex-col items-center justify-center text-center">
        <div class="w-16 h-16 rounded-full bg-[var(--color-surface-subtle)] text-[var(--color-text-disabled)] flex items-center justify-center mb-4">
          <span class="material-symbols-outlined text-3xl">notifications_off</span>
        </div>
        <h3 class="font-display text-lg font-bold text-[var(--color-text-main)] mb-1">Quiet Environment</h3>
        <p class="text-sm text-[var(--color-text-muted)]">No active broadcasts found for this segment.</p>
      </div>`;
      return;
    }

    container.innerHTML = filtered.map(n => {
      const isHtmlColor = n.iconBg.includes('rgba') || n.iconBg.includes('#');
      const bgStyle = isHtmlColor ? `style="background:${n.iconBg}"` : '';
      const bgClass = isHtmlColor ? '' : n.iconBg;
      
      const isHtmlText = n.iconColor.includes('rgba') || n.iconColor.includes('#');
      const textStyle = isHtmlText ? `style="color:${n.iconColor}"` : '';
      const textClass = isHtmlText ? '' : n.iconColor;
      
      const unreadBadge = n.unread ? `<span class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-8 bg-primary-base rounded-r-md"></span>` : '';
      const unreadBg = n.unread ? `bg-primary-surface/30` : `hover:bg-[var(--color-surface-subtle)]`;

      return `
      <div class="relative p-5 border-b border-[var(--color-border-main)] last:border-0 cursor-pointer transition-colors flex gap-4 ${unreadBg}" onclick="viewNotif(${n.id})">
        ${unreadBadge}
        <div class="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${bgClass}" ${bgStyle}>
          <span class="material-symbols-outlined text-xl ${textClass}" ${textStyle}>${n.icon}</span>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-start mb-1">
            <h4 class="font-bold text-[var(--color-text-main)] truncate pr-4 ${n.unread ? 'text-primary-base' : ''}">${n.title}</h4>
            <span class="text-[10px] font-bold text-[var(--color-text-muted)] uppercase tracking-wider shrink-0 mt-0.5">${n.time}</span>
          </div>
          <p class="text-sm text-[var(--color-text-secondary)] line-clamp-2 leading-relaxed">${n.body}</p>
        </div>
      </div>`;
    }).join('');
  }

  let currentViewNotifId = null;

  function viewNotif(id) {
    const n = notifs.find(x => x.id === id);
    if (n) {
      n.unread = false;
      currentViewNotifId = id;
      document.getElementById('viewNotifTitle').textContent = n.title;
      document.getElementById('viewNotifBody').textContent = n.body;
      document.getElementById('viewNotifDate').textContent = n.time;

      const iconContainer = document.getElementById('viewNotifIcon');
      const isHtmlColor = n.iconBg.includes('rgba') || n.iconBg.includes('#');
      const isHtmlText = n.iconColor.includes('rgba') || n.iconColor.includes('#');
      
      iconContainer.className = `w-16 h-16 mx-auto rounded-2xl flex items-center justify-center mb-4 ${isHtmlColor ? '' : n.iconBg}`;
      if (isHtmlColor) iconContainer.style.background = n.iconBg;
      else iconContainer.style.background = '';
      
      iconContainer.innerHTML = `<span class="material-symbols-outlined text-3xl ${isHtmlText ? '' : n.iconColor}" ${isHtmlText ? `style="color:${n.iconColor}"` : ''}>${n.icon}</span>`;

      fetch('../../../app/Controllers/user/notifications.php', { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, credentials: 'same-origin', body: 'action=mark_read&notification_id=' + id }).catch(() => {});
      
      renderNotifs();
      
      const modal = document.getElementById('viewNotifModal');
      modal.classList.remove('hidden');
    }
  }
  
  function closeModal(id) {
    document.getElementById(id).classList.add('hidden');
  }

  function deleteCurrentNotif() {
    if (currentViewNotifId !== null) {
      fetch('../../../app/Controllers/user/notifications.php', { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, credentials: 'same-origin', body: 'action=delete&notification_id=' + currentViewNotifId }).catch(() => {});
      notifs = notifs.filter(n => n.id !== currentViewNotifId);
      currentViewNotifId = null;
      renderNotifs();
      closeModal('viewNotifModal');
      showToast('Record deleted from ledger', 'success');
    }
  }

  function markAllRead() {
    fetch('../../../app/Controllers/user/notifications.php', { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, credentials: 'same-origin', body: 'action=mark_all_read' }).catch(() => {});
    notifs.forEach(n => n.unread = false);
    renderNotifs();
    showToast('All broadcasts read', 'success');
  }

  function clearAll() {
    openConfirm('Delete All Records', 'This action will permanently remove all notifications from your signal ledger. Proceed?', () => {
      fetch('../../../app/Controllers/user/notifications.php', { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, credentials: 'same-origin', body: 'action=clear_all' }).catch(() => {});
      notifs = [];
      renderNotifs();
      showToast('Activity feed cleared', 'success');
    }, false);
  }

  function filterNotifs(type, el) {
    activeFilter = type;
    
    document.querySelectorAll('.filter-item').forEach(b => {
      b.className = 'filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-[var(--color-text-muted)] hover:bg-[var(--color-surface-subtle)] hover:text-[var(--color-text-main)]';
      const badge = b.querySelector('span:last-child');
      badge.className = 'text-xs py-0.5 px-2 rounded-full bg-[var(--color-border-main)]/50';
    });
    
    el.className = 'filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-primary-base bg-primary-surface';
    el.querySelector('span:last-child').className = 'text-xs py-0.5 px-2 rounded-full bg-white/50 border border-primary-base/10';
    
    renderNotifs();
  }

  loadNotifications();
</script>
</body>
</html>
