<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notifications | Finzo</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/Finzo/public/assets/js/tailwind-config.js"></script>
  <link href="/Finzo/public/assets/css/main.css" rel="stylesheet"/>
<link rel="stylesheet" href="/Finzo/public/assets/css/pages/user/notifications.css"/>
</head>
<body class="bg-[var(--color-surface-subtle)] font-body text-[var(--color-text-main)] antialiased">
<script src="/Finzo/public/assets/js/user/user-shared.js"></script>
<div id="sidebar-root"></div>
<div class="main">
<div id="navbar-root"></div>

<div class="page-content ds-container py-8">
  <div class="flex justify-between items-end mb-8 ds-animate-fade">
    <div>
      <div class="text-sm font-bold text-[var(--color-text-muted)] uppercase tracking-wider mb-1">Communication Center</div>
      <h1 class="font-display text-3xl font-extrabold text-[var(--color-text-main)] tracking-tight">Activity Feed</h1>
      <p class="text-[var(--color-text-muted)] mt-1">Unified broadcast from the Finzo ecosystem.</p>
    </div>
    <button data-action="markAllRead()" class="btn btn-secondary btn-sm no-print mb-1">Mark all as read</button>
  </div>

  <div class="flex flex-col lg:flex-row gap-8">
    <!-- LEFT: FILTERS SIDEBAR -->
    <div class="w-full lg:w-1/4 ds-animate-slide-up">
      <div class="ds-card sticky top-24">
        <div class="ds-card-body p-6">
          <div class="text-xs font-bold text-[var(--color-text-muted)] uppercase tracking-widest mb-4">Signal Distribution</div>
          
          <!-- UNREAD ALERTS BUBBLE -->
          <div class="p-4 rounded-xl bg-primary-surface border border-primary-base/20 mb-6 flex flex-col items-center justify-center text-center">
            <div class="text-[10px] font-bold text-primary-base uppercase tracking-widest mb-1">Unread Alerts</div>
            <div class="font-display text-4xl font-black text-primary-base" id="unread-stat">0</div>
          </div>

          <!-- FILTERS -->
          <div class="flex flex-col gap-2">
            <button class="filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-primary-base bg-primary-surface" data-action="filterNotifs(&#039;all&#039;,this)">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-lg">grid_view</span> All Broadcasts
              </div>
              <span class="text-xs py-0.5 px-2 rounded-full bg-white/50 border border-primary-base/10" id="count-all">0</span>
            </button>
            
            <button class="filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-[var(--color-text-muted)] hover:bg-[var(--color-surface-subtle)] hover:text-[var(--color-text-main)]" data-action="filterNotifs(&#039;transaction&#039;,this)">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-lg">payments</span> Transactions
              </div>
              <span class="text-xs py-0.5 px-2 rounded-full bg-[var(--color-border-main)]/50" id="count-transaction">0</span>
            </button>
            
            <button class="filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-[var(--color-text-muted)] hover:bg-[var(--color-surface-subtle)] hover:text-[var(--color-text-main)]" data-action="filterNotifs(&#039;security&#039;,this)">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-lg">security</span> Security
              </div>
              <span class="text-xs py-0.5 px-2 rounded-full bg-[var(--color-border-main)]/50" id="count-security">0</span>
            </button>
            
            <button class="filter-item w-full flex items-center justify-between p-3 rounded-lg font-bold text-sm transition-colors text-[var(--color-text-muted)] hover:bg-[var(--color-surface-subtle)] hover:text-[var(--color-text-main)]" data-action="filterNotifs(&#039;system&#039;,this)">
              <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-lg">settings</span> System
              </div>
              <span class="text-xs py-0.5 px-2 rounded-full bg-[var(--color-border-main)]/50" id="count-system">0</span>
            </button>
          </div>

          <div class="mt-8 pt-6 border-t border-dashed border-[var(--color-border-main)]">
            <button data-action="clearAll()" class="w-full flex items-center justify-center gap-2 p-3 text-sm font-bold text-danger-base hover:bg-danger-surface rounded-lg transition-colors">
              <span class="material-symbols-outlined">delete_sweep</span> Delete All Records
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: NOTIFICATION FEED -->
    <div class="w-full lg:w-3/4 ds-animate-slide-up" style="animation-delay: 0.1s;">
      <div class="ds-card min-h-[400px]">
        <div id="notif-container" class="flex flex-col">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- View Notification Modal -->
<div id="viewNotifModal" class="modal-overlay hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="ds-card max-w-md w-full p-6 animate-in zoom-in-95 duration-200">
    <div id="viewNotifIcon" class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center mb-4"></div>
    <div id="viewNotifTitle" class="font-display text-xl font-bold text-center text-[var(--color-text-main)] mb-1">Broadcast Subject</div>
    <div id="viewNotifDate" class="text-center text-xs font-bold text-[var(--color-text-muted)] uppercase tracking-wider mb-6">TIMESTAMP</div>
    
    <div id="viewNotifBody" class="p-4 rounded-xl bg-[var(--color-surface-subtle)] border border-[var(--color-border-main)] text-sm text-[var(--color-text-main)] leading-relaxed mb-6">
      Message body content.
    </div>
    
    <div class="flex gap-4">
      <button class="btn btn-secondary flex-1" data-action="closeModal(&#039;viewNotifModal&#039;)">Read</button>
      <button class="btn btn-danger flex-1" data-action="deleteCurrentNotif()">Delete Record</button>
    </div>
  </div>
</div>


<script src="/Finzo/public/assets/js/pages/user/notifications.js"></script>
</body>
</html>
