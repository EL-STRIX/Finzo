<header class="h-20 bg-white/80 dark:bg-surface-dark/80 backdrop-blur-xl border-b border-surface-border dark:border-white/5 sticky top-0 z-50 px-4 sm:px-8 flex items-center justify-between staff-topbar">
    <div class="flex items-center gap-4">
        <button id="mobile-menu-btn" class="lg:hidden p-2 -ml-2 rounded-xl text-text-muted hover:bg-surface-hover dark:hover:bg-white/5 transition-all" aria-label="Toggle Navigation Menu">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
        <div class="hidden sm:block">
            <div class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-0.5">STAFF OVERVIEW</div>
            <div class="font-headline text-xl font-bold text-text-main dark:text-white" id="page-title">Portal</div>
        </div>
    </div>

    <div class="flex items-center gap-6">
        <div class="text-right hidden md:block">
            <div class="text-[10px] font-black text-text-muted uppercase tracking-widest mb-0.5" id="live-date">...</div>
            <div class="font-mono text-sm font-bold text-text-main dark:text-white" id="live-clock">...</div>
        </div>
        <div class="h-8 w-px bg-surface-border dark:bg-white/10 hidden md:block"></div>
        <button class="px-5 py-2.5 bg-danger-surface dark:bg-danger-surface/10 border border-danger-base dark:border-danger-base/20 text-danger-base dark:text-danger-base font-bold text-xs uppercase tracking-widest rounded-xl hover:bg-danger-surface dark:hover:bg-danger-surface/20 transition-all end-shift-trigger">
            End Shift
        </button>
    </div>
</header>
