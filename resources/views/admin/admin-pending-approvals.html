<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Finzo Admin — Pending Approvals</title>
    <meta name="description" content="Review and manage KYC applications pending approval in the Finzo admin console." />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    
    <script src="/Finzo/public/assets/js/tailwind-config.js"></script>
  <link href="/Finzo/public/assets/css/main.css" rel="stylesheet"/>
      <script src="/Finzo/public/assets/js/core/ui-components.js"></script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 font-body antialiased">

    <!-- SIDEBAR -->
    <div class="admin-sidebar-overlay" id="sidebar-overlay"></div>
    <!-- SIDEBAR COMPONENT -->
    <div data-include="/Finzo/resources/views/layouts/admin-sidebar.html"></div>

    <!-- MAIN AREA -->
    <div class="admin-main flex-1 flex flex-col min-w-0">
        <!-- TOP NAVBAR COMPONENT -->
        <div data-include="/Finzo/resources/views/layouts/admin-navbar.html"></div>

        <main class="p-4 sm:p-6 lg:p-10 min-w-0 flex-1 w-full flex flex-col">

            <!-- STAT CARDS -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-6 mb-6 sm:mb-10">
                <div class="ds-card p-5 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-500/10 text-amber-600 flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined">hourglass_empty</span>
                    </div>
                    <div>
                        <div class="admin-stat-label text-[10px] font-bold uppercase tracking-widest text-slate-400">PENDING REVIEW</div>
                        <div class="text-xl font-black mt-1 skeleton min-w-[40px]">—</div>
                    </div>
                </div>
                <div class="ds-card p-5 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-500/10 text-blue-600 flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined">rate_review</span>
                    </div>
                    <div>
                        <div class="admin-stat-label text-[10px] font-bold uppercase tracking-widest text-slate-400">UNDER REVIEW</div>
                        <div class="text-xl font-black mt-1 skeleton min-w-[40px]">—</div>
                    </div>
                </div>
                <div class="ds-card p-5 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined">check_circle</span>
                    </div>
                    <div>
                        <div class="admin-stat-label text-[10px] font-bold uppercase tracking-widest text-slate-400">APPROVED TODAY</div>
                        <div class="text-xl font-black mt-1 skeleton min-w-[40px]">—</div>
                    </div>
                </div>
                <div class="ds-card p-5 flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 flex items-center justify-center shrink-0">
                        <span class="material-symbols-outlined">verified</span>
                    </div>
                    <div>
                        <div class="admin-stat-label text-[10px] font-bold uppercase tracking-widest text-slate-400">TOTAL APPROVED</div>
                        <div class="text-xl font-black mt-1 skeleton min-w-[40px]">—</div>
                    </div>
                </div>
            </div>

            <!-- FILTERS + TABS + TABLE -->
            <div class="ds-card overflow-hidden">
                <div class="p-4 sm:p-6 border-b border-slate-50 dark:border-white/5 bg-slate-50/20 dark:bg-white/5">
                    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                        <!-- Search -->
                        <div class="w-full md:w-96">
                            <label class="ds-label mb-2">Search Applications</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                                <input type="text" id="approval-search" placeholder="Search by name or user ID..." class="ds-input pl-12">
                            </div>
                        </div>

                        <!-- Status Tabs -->
                        <div class="flex flex-wrap gap-2">
                            <button class="tab-btn px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all duration-200 bg-primary text-white shadow-lg shadow-primary/20 scale-[1.02] dark:bg-sky-500/20 dark:text-sky-300 dark:shadow-none dark:ring-1 dark:ring-sky-500/30" data-status="all">
                                All
                            </button>
                            <button class="tab-btn px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200/80 hover:text-slate-800 hover:scale-[1.01] dark:bg-white/5 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-slate-200" data-status="pending">
                                <span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px;">hourglass_empty</span>
                                Pending
                            </button>
                            <button class="tab-btn px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200/80 hover:text-slate-800 hover:scale-[1.01] dark:bg-white/5 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-slate-200" data-status="under_review">
                                <span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px;">rate_review</span>
                                Under Review
                            </button>
                        </div>
                    </div>
                </div>
                <div class="overflow-x-auto w-full">
                    <table id="approvals-table" class="ds-table w-full text-left min-w-[1300px]">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Applicant</th>
                                <th>Phone</th>
                                <th>Account Type</th>
                                <th>ID Type</th>
                                <th>Date Applied</th>
                                <th>Status</th>
                                <th class="text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="applications-table-body">
                            <!-- Data injected by pending-approvals.js -->
                        </tbody>
                    </table>
                </div>

                <!-- PAGINATION -->
                <div class="p-4 sm:p-6 bg-slate-50/50 dark:bg-white/5 border-t border-slate-50 dark:border-white/5 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div id="pagination-info" class="text-[11px] font-bold opacity-40 uppercase tracking-widest">Showing 0-0 of 0 Items</div>
                    <div class="flex items-center gap-2">
                        <button id="prev-btn" class="admin-btn-secondary px-4 !py-2 !text-[11px] disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
                        <div id="page-numbers" class="flex gap-1.5">
                            <!-- Page numbers injected by pending-approvals.js -->
                        </div>
                        <button id="next-btn" class="admin-btn-secondary px-4 !py-2 !text-[11px] disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
                    </div>
                </div>
            </div>

        </main>
    </div>
    <script src="/Finzo/public/assets/js/core/utils.js"></script>
    <script src="/Finzo/public/assets/js/core/api.js"></script>
    <script src="/Finzo/public/assets/js/admin/admin-shared.js"></script>
    <script src="/Finzo/public/assets/js/admin/pending-approvals.js"></script>
    <script src="/Finzo/public/assets/js/core/component-loader.js"></script>
</body>

</html>
