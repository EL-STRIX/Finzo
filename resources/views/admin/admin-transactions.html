<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Finzo Admin — Transactions</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    
    <script src="/Finzo/public/assets/js/tailwind-config.js"></script>
  <link href="/Finzo/public/assets/css/main.css" rel="stylesheet"/>
      <script src="/Finzo/public/assets/js/core/ui-components.js"></script>
</head>

<body class="bg-slate-50 dark:bg-slate-900 font-body antialiased">

    <!-- SIDEBAR -->
    <div class="admin-sidebar-overlay" id="sidebar-overlay"></div>
    <!-- SIDEBAR COMPONENT -->
    <div data-include="/Finzo/resources/views/layouts/admin-sidebar.html"></div>

    <!-- MAIN AREA -->
    <div class="admin-main min-w-0 flex-1">
        <!-- TOP NAVBAR COMPONENT -->
        <div data-include="/Finzo/resources/views/layouts/admin-navbar.html"></div>

        <main class="p-4 sm:p-6 lg:p-10 min-w-0 flex-1 w-full flex flex-col">
            <!-- FILTERS & TABLE -->
            <div class="ds-card overflow-hidden">
                <div class="p-4 sm:p-6 border-b border-slate-50 dark:border-white/5 bg-slate-50/20 dark:bg-white/5 relative z-20">
                    <div class="flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                        <!-- Search -->
                        <div class="w-full md:w-96">
                            <label class="ds-label mb-2">Search Transactions</label>
                            <div class="relative">
                                <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                                <input type="text" id="transaction-search" placeholder="Search by TXN ID, Name or Note..." class="ds-input pl-12">
                            </div>
                        </div>

                        <!-- Type Tabs -->
                        <div class="flex flex-wrap gap-2 mt-4 md:mt-0">
                            <button class="tab-btn px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all duration-200 bg-primary text-white shadow-lg shadow-primary/20 scale-[1.02] dark:bg-sky-500/20 dark:text-sky-300 dark:shadow-none dark:ring-1 dark:ring-sky-500/30" data-type="all">
                                All
                            </button>
                            <button class="tab-btn px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200/80 hover:text-slate-800 hover:scale-[1.01] dark:bg-white/5 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-slate-200" data-type="deposit">
                                <span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px;">south_west</span>
                                Deposits
                            </button>
                            <button class="tab-btn px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200/80 hover:text-slate-800 hover:scale-[1.01] dark:bg-white/5 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-slate-200" data-type="withdrawal">
                                <span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px;">north_east</span>
                                Withdrawals
                            </button>
                            <button class="tab-btn px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200/80 hover:text-slate-800 hover:scale-[1.01] dark:bg-white/5 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-slate-200" data-type="transfer">
                                <span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px;">sync_alt</span>
                                Transfers
                            </button>
                            <button class="tab-btn px-4 py-2.5 rounded-xl text-[11px] font-black uppercase tracking-widest transition-all duration-200 bg-slate-100 text-slate-600 hover:bg-slate-200/80 hover:text-slate-800 hover:scale-[1.01] dark:bg-white/5 dark:text-slate-400 dark:hover:bg-white/10 dark:hover:text-slate-200" data-type="interest_credit">
                                <span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px;">percent</span>
                                Interest
                            </button>
                        </div>
                    </div>

                </div>
                <div class="overflow-x-auto w-full">
                    <table id="transactions-table" class="ds-table w-full text-left min-w-[1300px]">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>TXN ID</th>
                                <th>From Account</th>
                                <th>To Account</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th class="text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="txn-table-body">
                            <!-- Data injected by transactions.js -->
                        </tbody>
                    </table>
                </div>

                <!-- PAGINATION -->
                <div class="p-4 sm:p-6 bg-slate-50/50 dark:bg-white/5 border-t border-slate-50 dark:border-white/5 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div id="pagination-info" class="text-[11px] font-bold opacity-40 uppercase tracking-widest">Showing 0-0 of 0 Records</div>
                    <div class="flex items-center gap-2">
                        <button id="prev-btn" class="admin-btn-secondary px-4 !py-2 !text-[11px] disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
                        <div id="page-numbers" class="flex gap-1.5">
                            <!-- Page numbers injected by transactions.js -->
                        </div>
                        <button id="next-btn" class="admin-btn-secondary px-4 !py-2 !text-[11px] disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- EXPORT MODAL -->
    <div id="export-modal" class="fixed inset-0 z-[2000] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm close-export-modal transition-all"></div>
        <div class="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-[2rem] overflow-hidden shadow-2xl flex flex-col max-h-[90vh] border border-slate-100 dark:border-white/5 animate-modal-enter">
            <div class="p-8 pb-4 text-center shrink-0">
                <div class="w-16 h-16 rounded-full mx-auto flex items-center justify-center mb-4 text-primary bg-primary/5 dark:bg-primary/20">
                    <span class="material-symbols-outlined text-4xl">download</span>
                </div>
                <h3 class="font-headline text-2xl font-black text-slate-900 dark:text-white">Export Data</h3>
                <p class="text-sm text-slate-500 font-medium mt-1">Download a complete ledger of transactions</p>
            </div>
            <div class="px-8 py-4 space-y-6 overflow-y-auto">
                <div class="text-sm text-center text-slate-600 dark:text-slate-400 font-medium leading-relaxed px-4">
                    The report will be generated in Microsoft Excel format, filtered by your currently selected criteria.
                </div>
            </div>
            <div class="p-8 pt-4 flex gap-3 shrink-0 border-t border-slate-100 dark:border-white/5 mt-2">
                <button class="flex-1 py-4 bg-slate-100 dark:bg-white/5 hover:bg-slate-200 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400 font-black rounded-2xl text-[11px] uppercase tracking-widest transition-all close-export-modal">Cancel</button>
                <button id="start-export" class="flex-1 py-4 text-white font-black rounded-2xl text-[11px] uppercase tracking-widest shadow-lg transition-all bg-primary shadow-primary/20 hover:bg-primary/90 hover:scale-[1.02] active:scale-[0.98]">Generate Report</button>
            </div>
        </div>
    </div>
    <script src="/Finzo/public/assets/js/core/utils.js"></script>
    <script src="/Finzo/public/assets/js/core/api.js"></script>
    <script src="/Finzo/public/assets/js/admin/admin-shared.js"></script>
    <script src="/Finzo/public/assets/js/admin/transactions.js"></script>
    <script src="/Finzo/public/assets/js/core/component-loader.js"></script>
</body>

</html>
